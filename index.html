  // 입력 폼은 가게 필드와 방문 필드를 한 장의 draft로 다룬다
  var PLACE_FORM_FIELDS = ['name', 'category', 'area', 'revisit'];
  var VISIT_FORM_FIELDS = ['visitedAt', 'rating', 'oneLiner', 'menus', 'photos', 'memo'];
  function draftFrom(place, visit){
    // location은 새 가게를 쓸 때만 쓴다 (이미 있는 가게의 위치는 가게 정보 고치기에서 바꾼다)
    var d = { name:'', category:'', area:'', location:null, revisit:'', visitedAt:place ? '' : today(), rating:0, oneLiner:'', menus:[], photos:[], memo:'' };
    if (place) PLACE_FORM_FIELDS.forEach(function(k){ d[k] = clone(place[k]); });
    if (visit) VISIT_FORM_FIELDS.forEach(function(k){ d[k] = clone(visit[k]); });
    return d;
  }
  function draftHasVisit(d){
    return !!(d.visitedAt || d.rating || d.oneLiner || d.menus.length || d.photos.length || d.memo);
  }
  // draft를 가게(+방문)에 반영한 새 가게를 돌려준다. place가 없으면 새 가게 + 새 방문.
  // 방문이 없던 가게는 방문 칸에 뭔가 적었을 때만 방문을 새로 만든다 (가짜 방문 금지)
  function applyDraft(place, visit, d){
    var p = place ? clone(place) : { id:uid(), location:d.location ? clone(d.location) : null, links:[], memo:'', fromWishIds:[], visits:[] };
    PLACE_FORM_FIELDS.forEach(function(k){ p[k] = d[k]; });
    var v = null;
    if (visit) {
      v = findVisit(p, visit.id);
    } else if (!place || draftHasVisit(d)) {
      v = { id:uid() };
      p.visits.push(v);
    }
    if (v) VISIT_FORM_FIELDS.forEach(function(k){ v[k] = clone(d[k]); });
    touch(p, v);
    return normalizePlace(p);
  }
  // 방문 하나를 저장한다.
  //  placeId 없음      → 새 가게 + 새 방문 (draft의 가게 칸을 쓴다)
  //  visitId 없음      → 그 가게에 새 방문. 가게 칸은 그대로, revisit만 draft 값이 된다
  //  visitId 있음      → 그 방문 고치기. 가게 칸과 revisit은 지금 가게 값 그대로
  //  wishId 있음       → 새 방문(visitId 없음)과 함께 그 가고 싶은 곳을 가게로 옮긴다 (applyWish).
  //                       방문 저장과 가고 싶은 곳 빼기는 한 번에 저장한다. 하나만 되는 일은 없다
  // 성공하면 { place, movedWish }, 아니면 { error }
  function saveVisit(placeId, visitId, d, wishId){
    var cur = placeId ? findPlace(placeId) : null;
    if (placeId && !cur) return { error:'이미 지운 기록이에요' };
    var visit = null;
    if (visitId) {
      visit = findVisit(cur, visitId);
      if (!visit) return { error:'이미 지운 기록이에요' };
    }
    var wish = wishId && !visitId ? findWish(wishId) : null;   // 그사이 지워졌으면 방문만 저장한다
    if (cur) {
      d.name = cur.name; d.category = cur.category; d.area = cur.area;
      if (visitId) d.revisit = cur.revisit;
      if (!visitId && !draftHasVisit(d)) return { error:'방문 내용을 하나라도 적어 주세요' };
    } else if (wish) {
      // 폼에 적거나 고른 값이 우선. 가고 싶은 곳 값은 비어 있는 칸만 채운다
      if (!d.name.trim()) d.name = wish.name;
      if (!d.category) d.category = wish.category;
      if (!d.area.trim()) d.area = wish.area;
    }
    var place = applyDraft(cur, visit, d);
    // 폼에서 위치를 직접 떼거나 고른 경우(locationTouched)에는 가고 싶은 곳의 위치로 채우지 않는다
    if (wish) place = applyWish(place, wish, !cur && !d.locationTouched);
    var wi = wish ? state.wishes.indexOf(wish) : -1;
    if (wi !== -1) state.wishes.splice(wi, 1);
    var ok;
    if (cur) {
      var pi = state.places.indexOf(cur);
      state.places[pi] = place;
      ok = save();
      if (!ok) state.places[pi] = cur;
    } else {
      state.places.push(place);
      ok = save();
      if (!ok) state.places.pop();
    }
    if (!ok) {
      if (wi !== -1) state.wishes.splice(wi, 0, wish);
      return { error:'' };
    }
    return { place:place, movedWish:wish };
  }
  // 가고 싶은 곳을 가게 p(새 사본)에 붙인다.
  //  - 링크는 links 끝에 (이미 있으면 붙이지 않는다)
  //  - 메모는 가게 memo 끝에 줄을 바꿔 (비어 있지 않을 때만)
  //  - fromWishIds에 가고 싶은 곳 id
  //  - isNew일 때만(새 가게이고 폼에서 위치를 건드리지 않았을 때): 위치가 비어 있으면 가고 싶은 곳의 위치
  function applyWish(p, w, isNew){
    p = clone(p);
    if (w.link && p.links.indexOf(w.link) === -1) p.links.push(w.link);
    if (w.memo) p.memo = p.memo ? p.memo + '\n' + w.memo : w.memo;
    if (p.fromWishIds.indexOf(w.id) === -1) p.fromWishIds.push(w.id);
    if (isNew && !p.location && w.location) p.location = clone(w.location);
    return normalizePlace(p);
  }

  function openVisitForm(o){
    var mode = o.mode;
    var target = o.placeId ? findPlace(o.placeId) : null;
    if (mode !== 'new' && !target) { toast('이미 지운 기록이에요'); return; }
    var srcVisit = mode === 'edit' ? findVisit(target, o.visitId) : null;
    if (mode === 'edit' && !srcVisit) { toast('이미 지운 기록이에요'); return; }
    var draft = draftFrom(mode === 'new' ? null : target, srcVisit);
    if (mode === 'add') draft.visitedAt = today();
    // 가고 싶은 곳에서 "다녀왔어요": 가게 칸은 그 곳의 값, 먹은 메뉴 칸은 먹어 보고 싶은 메뉴 (이름만)
    var fromWish = mode === 'new' && o.wishId ? findWish(o.wishId) : null;
    if (o.wishId && !fromWish) { toast('이미 지운 기록이에요'); return; }
    if (fromWish) {
      draft.name = fromWish.name; draft.category = fromWish.category; draft.area = fromWish.area;
      draft.location = fromWish.location ? clone(fromWish.location) : null;
      draft.menus = fromWish.wantMenus.map(function(n){ var m = newMenu(); m.name = n; return m; });
    }
    if (!draft.menus.length) draft.menus.push(newMenu());
    var startPhotos = draft.photos.slice();
    var added = [];   // 이번에 새로 넣은 사진 — 취소하면 지운다
    var busy = 0;
    var dirty = false;
    var TITLES = { 'new':'새 맛집 기록', add:'또 다녀왔어요', edit:'방문 고치기' };

    var sheet = openSheet({
      title: TITLES[mode],
      leftLabel: '취소',
      right: '<button class="fd-text-btn strong" data-act="save">저장</button>',
      body: visitFormHTML(draft, mode, target)
    });
    sheet.dataset.form = 'visit';
    var photosEl = $('#fd-ed-photos', sheet), menusEl = $('#fd-ed-menus', sheet);
    var sameEl = $('#fd-ed-same', sheet);
    var sameKey = '', dismissedKey = '';
    // 저장할 때 다녀온 곳으로 옮길 가고 싶은 곳. wishFixed: "다녀왔어요"로 연 폼이라 바꾸지 않는다
    var wishEl = $('#fd-ed-wish', sheet);
    var wishMove = fromWish, wishFixed = !!fromWish;
    var wishKey = '', wishChosenKey = '', wishDismissedKey = '';

    function drawPhotos(){
      photosEl.innerHTML = draft.photos.map(photoTileHTML).join('') +
        (draft.photos.length + busy < MAX_PHOTOS
          ? '<button type="button" class="fd-photo-add fd-press" data-act="add-photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>' +
            (draft.photos.length ? draft.photos.length + ' / ' + MAX_PHOTOS : '사진 추가') + '</button>'
          : '');
      for (var i = 0; i < busy; i++) photosEl.insertAdjacentHTML('beforeend', '<div class="fd-photo-tile"><div class="fd-spinner"></div></div>');
      hydrateImgs(photosEl);
    }
    drawPhotos();

    // 새 가게의 위치. 고르면 빈 이름·빈 종류만 채우고 같은 가게를 다시 본다
    var locRoot = $('#fd-ed-location [data-loc-root]', sheet);
    if (locRoot) mountLocPicker(locRoot, {
      get: function(){ return draft.location; },
      query: function(){ return draft.name; },
      onPick: function(loc, r){
        dirty = true;
        draft.location = loc; draft.locationTouched = true;
        if (!draft.name.trim()) { draft.name = loc.placeName; $('#fd-ed-name', sheet).value = draft.name; }
        var c = draft.category ? '' : kakaoCategory(r.category_name, r.category_group_code);
        if (c) {
          draft.category = c;
          $all('#fd-ed-placebox [data-pick-cat]', sheet).forEach(function(b){ b.classList.toggle('on', b.dataset.pickCat === c); });
        }
        checkSame();
      },
      onRemove: function(){
        dirty = true;
        draft.location = null; draft.locationTouched = true;
        checkSame();
      }
    });

    function formCand(){ return { name:draft.name, location:draft.location }; }
    // 새 가게 이름에서 손을 떼거나 위치를 고르면 같은 가게가 있는지 본다. 알림 칸만 바꾼다
    function checkSame(){
      if (mode !== 'new' || !sameEl) return;
      var cand = formCand(), key = sameKeyOf(cand);
      if (key === sameKey) return;
      var list = key && key !== dismissedKey ? samePlaceCandidates(cand) : [];
      sameKey = list.length ? key : '';
      sameEl.innerHTML = list.length ? sameNoticeHTML(list) : '';
      if (!list.length) checkWish(cand);   // 다녀온 곳을 먼저 본다
    }
    // 가고 싶은 곳에 같은 곳이 있는지 본다. 묻는 칸만 바꾼다
    function checkWish(cand){
      if (wishFixed || !wishEl) return;
      var key = sameKeyOf(cand);
      if (wishMove && key === wishChosenKey) return;
      if (key && key === wishKey) return;
      wishMove = null; wishChosenKey = '';
      var list = key && key !== wishDismissedKey ? sameWishCandidates(cand) : [];
      wishKey = list.length ? key : '';
      wishEl.innerHTML = list.length ? wishMoveHTML(list) : '';
    }
    // 같은 가게를 골랐을 때: 방문 칸은 그대로 두고 그 가게의 새 방문으로 바꾼다.
    // 적어 둔 가게 칸은 쓰지 않고, 또 갈래요는 그 가게 값으로 다시 채운다
    function switchToPlace(p){
      target = p; mode = 'add';
      sameKey = ''; sameEl.innerHTML = '';
      draft.name = p.name; draft.category = p.category; draft.area = p.area;
      draft.revisit = p.revisit;
      $all('[data-revisit]', sheet).forEach(function(b){ b.classList.toggle('on', b.dataset.revisit === draft.revisit); });
      $('#fd-ed-placebox', sheet).hidden = true;
      $('#fd-ed-placename', sheet).textContent = p.name || '이름 없는 가게';
      $('#fd-ed-placeemoji', sheet).textContent = catEmoji(p.category);
      $('#fd-ed-placehead', sheet).hidden = false;
      $('.fd-sheet-head h2', sheet).textContent = TITLES.add;
      dirty = true;
      // 가고 싶은 곳 칸은 가게 칸과 함께 숨지 않도록 가게 이름 줄 아래로 옮기고,
      // 붙인 가게와 같은 가고 싶은 곳이 있으면 이어서 묻는다
      $('#fd-ed-placehead', sheet).insertAdjacentElement('afterend', wishEl);
      checkWish({ name:p.name, location:p.location });
    }

    function menuOf(el){
      var box = el.closest('[data-mid]');
      if (!box) return null;
      for (var i = 0; i < draft.menus.length; i++) if (draft.menus[i].id === box.dataset.mid) return draft.menus[i];
      return null;
    }
    function setStars(wrap, v){
      $all('button', wrap).forEach(function(b){
        var n = Number(b.dataset.star);
        b.classList.toggle('on', n <= v);
        b.classList.remove('pop');
        if (n === v) { void b.offsetWidth; b.classList.add('pop'); }
      });
    }

    sheet.addEventListener('input', function(e){
      var t = e.target;
      dirty = true;
      if (t.dataset.f) {
        draft[t.dataset.f] = t.value;
        if (t.dataset.f === 'oneLiner') $('#fd-ed-one-count', sheet).textContent = t.value.length + ' / 60';
      } else if (t.dataset.mf) {
        var m = menuOf(t);
        if (m) m[t.dataset.mf] = t.value;
      }
    });
    function onNameLeave(e){ if (e.target.dataset && e.target.dataset.f === 'name') checkSame(); }
    sheet.addEventListener('focusout', onNameLeave);
    sheet.addEventListener('change', onNameLeave);
    sheet.addEventListener('keydown', function(e){
      // 메뉴 이름에서 완료를 누르면 한마디 칸으로
      if (e.key === 'Enter' && e.target.dataset && e.target.dataset.mf === 'name') {
        e.preventDefault();
        var note = $('[data-mf="note"]', e.target.closest('[data-mid]'));
        if (note) note.focus();
      }
    });

    sheet.addEventListener('click', function(e){
      var t = e.target;
      var star = t.closest('[data-star]');
      if (star) {
        var v = Number(star.dataset.star), wrap = star.parentNode, m = menuOf(star);
        dirty = true;
        if (m) {
          m.rating = m.rating === v ? 0 : v;
          setStars(wrap, m.rating);
        } else {
          draft.rating = v;
          setStars(wrap, v);
          $('.fd-rate-word', sheet).textContent = RATE_WORDS[v];
        }
        return;
      }
      var cat = t.closest('[data-pick-cat]');
      if (cat) {
        dirty = true;
        draft.category = draft.category === cat.dataset.pickCat ? '' : cat.dataset.pickCat;
        $all('[data-pick-cat]', sheet).forEach(function(b){ b.classList.toggle('on', b.dataset.pickCat === draft.category); });
        return;
      }
      var rv = t.closest('[data-revisit]');
      if (rv) {
        dirty = true;
        draft.revisit = draft.revisit === rv.dataset.revisit ? '' : rv.dataset.revisit;
        $all('[data-revisit]', sheet).forEach(function(b){ b.classList.toggle('on', b.dataset.revisit === draft.revisit); });
        return;
      }
      var pick = t.closest('[data-same-pick]');
      if (pick) {
        var p = findPlace(pick.dataset.samePick);
        if (p) switchToPlace(p); else { sameKey = ''; checkSame(); }
        return;
      }
      var wm = t.closest('[data-wish-move]');
      if (wm) {
        var w = findWish(wm.dataset.wishMove);
        if (!w) { wishKey = ''; wishEl.innerHTML = ''; return; }
        dirty = true;
        wishMove = w; wishChosenKey = wishKey; wishKey = '';
        wishEl.innerHTML = wishMovingHTML(w, false);
        return;
      }
      var act = t.closest('[data-act]');
      if (!act) {
        var tile = t.closest('[data-photo]');
        if (tile) {
          var idx = draft.photos.indexOf(tile.dataset.photo);
          if (idx > 0) { dirty = true; draft.photos.unshift(draft.photos.splice(idx, 1)[0]); drawPhotos(); }
        }
        return;
      }
      switch (act.dataset.act) {
        case 'close': cancel(); break;
        case 'save': commit(); break;
        case 'same-new':
          dismissedKey = sameKey; sameKey = ''; sameEl.innerHTML = '';
          checkWish(formCand());
          break;
        case 'wish-no':
          wishDismissedKey = wishKey; wishKey = ''; wishEl.innerHTML = '';
          break;
        case 'wish-undo':
          wishDismissedKey = wishChosenKey; wishMove = null; wishChosenKey = ''; wishEl.innerHTML = '';
          break;
        case 'add-menu':
          dirty = true;
          var m2 = newMenu();
          draft.menus.push(m2);
          menusEl.insertAdjacentHTML('beforeend', menuEditHTML(m2));
          $('[data-mid="' + m2.id + '"] [data-mf="name"]', menusEl).focus();
          break;
        case 'del-menu':
          dirty = true;
          var box = act.closest('[data-mid]');
          draft.menus = draft.menus.filter(function(x){ return x.id !== box.dataset.mid; });
          box.remove();
          break;
        case 'add-photo':
          pickPhotos();
          break;
        case 'del-photo':
          dirty = true;
          var pid = act.closest('[data-photo]').dataset.photo;
          draft.photos = draft.photos.filter(function(x){ return x !== pid; });
          drawPhotos();
          break;
      }
    });

    function pickPhotos(){
      var input = $('#fd-photo-input');
      input.value = '';
      input.onchange = function(){
        var files = Array.prototype.slice.call(input.files || []);
        var room = MAX_PHOTOS - draft.photos.length - busy;
        if (files.length > room) toast('사진은 한 방문에 ' + MAX_PHOTOS + '장까지 넣을 수 있어요');
        files = files.slice(0, Math.max(0, room));
        if (!files.length) return;
        dirty = true;
        busy += files.length;
        drawPhotos();
        files.reduce(function(chain, f){
          return chain.then(function(){
            return processPhoto(f).then(function(rec){
              return photoPut(rec).then(function(){
                if (sheet.closed) { photoDel([rec.id]); return; }
                added.push(rec.id);
                draft.photos.push(rec.id);
              });
            }).catch(function(){ toast('사진 한 장을 읽지 못했어요'); })
              .then(function(){ busy--; if (!sheet.closed) drawPhotos(); });
          });
        }, Promise.resolve());
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
      };
      input.click();
    }

    function cancel(){
      if (dirty && !confirm(mode === 'edit' ? '고친 내용을 저장하지 않고 닫을까요?' : '작성 중인 기록을 버릴까요?')) return;
      photoDel(added);
      sheet.close();
    }
    function commit(){
      if (busy) { toast('사진을 넣는 중이에요. 잠시만요'); return; }
      if (mode === 'new') {
        if (!draft.name.trim()) {
          toast('가게 이름을 적어 주세요');
          $('#fd-ed-name', sheet).focus();
          return;
        }
        checkSame();
        if (sameKey) {
          toast('같은 가게인지 먼저 골라 주세요');
          sameEl.scrollIntoView({ block:'center', behavior:'smooth' });
          return;
        }
      }
      if (wishKey) {
        toast('가고 싶은 곳에서 옮길지 먼저 골라 주세요');
        wishEl.scrollIntoView({ block:'center', behavior:'smooth' });
        return;
      }
      // 저장할 값은 사본으로 만든다. 저장이 안 되면 폼과 draft는 그대로 남는다
      var out = clone(draft);
      out.name = out.name.trim();
      out.area = out.area.trim();
      if (mode === 'edit') {
        // 옛 방문 고치기: 손대지 않은 값은 저장된 그대로 둔다. 바꾼 칸만 공백을 정리한다
        if (out.oneLiner !== srcVisit.oneLiner) out.oneLiner = out.oneLiner.trim();
        if (out.memo !== srcVisit.memo) out.memo = out.memo.replace(/\s+$/, '');
        out.menus = out.menus.map(function(m){
          var orig = null;
          srcVisit.menus.forEach(function(o){ if (o.id === m.id) orig = o; });
          if (!orig) {   // 이번에 넣은 줄
            m.name = m.name.trim(); m.note = m.note.trim();
            return (m.name || m.note || m.rating) ? m : null;
          }
          // 원래 있던 줄: 바뀌지 않은 칸은 저장된 값, 비어 보여도 지우지 않는다 (빼기 버튼으로만 빠진다)
          var r = clone(orig);
          if (m.name !== orig.name) r.name = m.name.trim();
          if (m.note !== orig.note) r.note = m.note.trim();
          r.rating = m.rating;
          return r;
        }).filter(Boolean);
      } else {
        out.oneLiner = out.oneLiner.trim();
        out.memo = out.memo.replace(/\s+$/, '');
        out.menus = out.menus
          .map(function(m){ m.name = m.name.trim(); m.note = m.note.trim(); return m; })
          .filter(function(m){ return m.name || m.note || m.rating; });
      }
      var res = saveVisit(target ? target.id : null, srcVisit ? srcVisit.id : null, out, wishMove && !srcVisit ? wishMove.id : null);
      if (!res.place) {
        if (res.error) toast(res.error);
        if (res.error === '이미 지운 기록이에요') { photoDel(added); sheet.close(); }
        return;
      }
      // 빠진 사진은 저장이 끝난 뒤에, 어느 방문에서도 쓰지 않을 때만 지운다
      photoDel(startPhotos.concat(added).filter(function(x){ return !photoInUse(x); }));
      render();
      sheet.close();
      refreshDetail(res.place.id);
      if (res.movedWish) refreshWishDetail(res.movedWish.id);
      toast(res.movedWish ? '다녀온 곳으로 옮겼어요 🍽️' : mode === 'edit' ? '고쳤어요 ✨' : mode === 'add' ? '방문을 더했어요 🍽️' : '맛집을 기록했어요 🍽️');
    }

    if (fromWish) {
      wishEl.innerHTML = wishMovingHTML(fromWish, true);
      checkSame();   // 다녀온 곳에 같은 가게가 있으면 바로 묻는다
    }
    if (mode === 'new') setTimeout(function(){ if (!sheet.closed && !draft.name) $('#fd-ed-name', sheet).focus(); }, 320);
  }

  // ---------- 가게 정보 고치기 ----------
  function linkEditHTML(l){
    return '<div class="fd-link-edit fd-row"><input class="fd-input" data-link value="' + esc(l) + '" placeholder="https://…" maxlength="500" autocomplete="off" inputmode="url" autocapitalize="off">' +
      '<button type="button" class="fd-menu-del" data-act="del-link" aria-label="링크 빼기">✕</button></div>';
  }
  function placeFormHTML(d){
    return '' +
      '<div class="fd-field" style="margin-top:8px"><label class="fd-label" for="fd-pf-name">가게 이름</label>' +
        '<input class="fd-input big" id="fd-pf-name" data-pf="name" value="' + esc(d.name) + '" placeholder="가게 이름" maxlength="40" autocomplete="off"></div>' +
      '<div class="fd-field"><label class="fd-label">종류</label>' + catPickHTML(d.category) + '</div>' +
      '<div class="fd-field"><label class="fd-label" for="fd-pf-area">지역</label><input class="fd-input" id="fd-pf-area" data-pf="area" value="' + esc(d.area) + '" placeholder="예: 성수동" maxlength="30" autocomplete="off"></div>' +
      '<div id="fd-pf-location">' + locPickerHTML() + '</div>' +
      '<div class="fd-field"><label class="fd-label">링크 <small>http로 시작하면 눌러서 열 수 있어요</small></label>' +
        '<div class="fd-link-edits" id="fd-pf-links">' + d.links.map(linkEditHTML).join('') + '</div>' +
        '<button type="button" class="fd-add-line fd-press" data-act="add-link" style="margin-top:8px">🔗 링크 추가</button></div>' +
      '<div class="fd-field"><label class="fd-label" for="fd-pf-memo">가게 메모</label>' +

  function openWishDetail(id){

  function removeWish(id){
    finishPendingDelete();
    var w = findWish(id);
    if (!w) return;
    var idx = state.wishes.indexOf(w);
    state.wishes.splice(idx, 1);
    if (!save()) { state.wishes.splice(idx, 0, w); return; }
    render();
    refreshWishDetail(id);
    startPendingDelete({ place:{ visits:[] }, placeId:null, restore:function(){
      if (findWish(id)) return true;
      state.wishes.splice(Math.min(idx, state.wishes.length), 0, w);
      if (save()) return true;
      state.wishes.splice(state.wishes.indexOf(w), 1);
      return false;
    } }, '가고 싶은 곳을 지웠어요');

    function checkSame(){
      var cand = { name:d.name, location:d.location };
      var key = sameKeyOf(cand);
      if (key === sameKey) return;
      var ps = key && key !== okKey ? samePlaceCandidates(cand) : [];
      var ws = key && key !== okKey ? sameWishCandidates(cand, id) : [];
      sameKey = ps.length || ws.length ? key : '';

    sheet.addEventListener('input', function(e){

    sheet.addEventListener('focusout', onNameLeave);
    sheet.addEventListener('change', onNameLeave);
    sheet.addEventListener('click', function(e){
      var t = e.target;
      var cat = t.closest('[data-pick-cat]');
      if (cat) {
        dirty = true;
        d.category = d.category === cat.dataset.pickCat ? '' : cat.dataset.pickCat;
        $all('[data-pick-cat]', sheet).forEach(function(b){ b.classList.toggle('on', b.dataset.pickCat === d.category); });

          break;

      // 손대지 않은 값은 그대로 둔다. 바꾼 칸만 앞뒤 공백을 정리한다
      var keep = function(v, old){ return cur && v === old ? old : v.trim(); };

      });
      var now = new Date().toISOString();
      var next = cur ? clone(cur) : { id:uid(), location:null, createdAt:now };
      next.name = name;
      next.category = d.category;

      next.memo = cur && d.memo === cur.memo ? cur.memo : d.memo.replace(/\s+$/, '');
      if (!cur || d.locationTouched) next.location = d.location ? clone(d.location) : null;   // 건드리지 않았으면 저장된 그대로

  // ---------- 백업 ----------
  function blobToDataUrl(b){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error); };
      r.readAsDataURL(b);
    });
  }
  function exportBackup(){
    finishPendingDelete();
    toast('백업 파일을 만드는 중…');
    var ids = allPhotoIds(state.places);
    var photos = {};
    ids.reduce(function(chain, id){
      return chain.then(function(){
        return photoGet(id).then(function(rec){
          if (!rec) return;
          return Promise.all([blobToDataUrl(rec.full), blobToDataUrl(rec.thumb)]).then(function(u){
            photos[id] = { full:u[0], thumb:u[1] };
          });
        });
      });
    }, Promise.resolve()).then(function(){
      var json = JSON.stringify({ app:'food-diary', version:2, exportedAt:new Date().toISOString(), places:state.places, wishes:state.wishes, photos:photos });
      var name = '맛집기록서-' + today() + '.json';
      var file = new File([json], name, { type:'application/json' });
      var touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
      if (touch && navigator.canShare && navigator.canShare({ files:[file] })) {
        return navigator.share({ files:[file] }).then(function(){ toast('백업 파일을 보냈어요'); }, function(err){
          if (err && err.name !== 'AbortError') download(file, name);
        });
      }
      download(file, name);
    }).catch(function(){ toast('백업 파일을 만들지 못했어요'); });
  }
  function download(file, name){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast('백업 파일을 저장했어요 📦');
  }
  // 백업 파일 → { places, wishes, photos }. 1판 파일(version 1 또는 없음)은 옮기기 규칙 그대로 바꾼다.
  // 받을 수 없는 파일이면 null
  function readBackup(data){
    if (!data || typeof data !== 'object' || data.app !== 'food-diary' || !Array.isArray(data.places)) return null;
    var photos = data.photos && typeof data.photos === 'object' ? data.photos : {};
    if (data.version == null || data.version === 1) return { places:placesFromV1(data.places), wishes:[], photos:photos };
    if (data.version === 2) {
      var s = normalizeState(data);
      return { places:s.places, wishes:s.wishes, photos:photos };
    }
    return null;
  }
  // 사진은 지금 기기에 없는 것만 넣는다. 합친 결과의 방문이 쓰는 사진만 본다
  function missingPhotos(places, photos){
    var ids = allPhotoIds(places).filter(function(id){ return photos[id] && photos[id].full; });
    var need = [];
    return ids.reduce(function(chain, id){
      return chain.then(function(){
        return photoGet(id).then(function(have){ if (!have) need.push(id); }, function(){});
      });
    }, Promise.resolve()).then(function(){ return need; });
  }
  function importBackup(){
    var input = $('#fd-import-input');
    input.value = '';
    input.onchange = function(){
      var f = input.files && input.files[0];
      if (!f) return;
      f.text().then(function(text){
        var data;
        try { data = JSON.parse(text); } catch (e) { toast('읽을 수 없는 파일이에요'); return; }
        var inc = readBackup(data);
        if (!inc) {
          toast(data && data.app === 'food-diary' && typeof data.version === 'number' && data.version > 2
            ? '더 새 버전에서 만든 백업이라 불러올 수 없어요' : '맛집 기록서 백업 파일이 아니에요');
          return;
        }
        // 지우기 되돌리기가 남아 있으면 먼저 끝낸다 (되돌리기와 불러오기가 겹치면 같은 가게가 둘이 된다)
        finishPendingDelete();
        var merged = mergeData(state, inc);
        var same = JSON.stringify({ p:merged.places, w:merged.wishes }) === JSON.stringify({ p:state.places, w:state.wishes });
        return missingPhotos(merged.places, inc.photos).then(function(need){
          var c = merged.counts;
          if (same && !need.length) { toast('이미 다 들어 있는 기록이에요'); return; }
          var parts = [];
          if (c.newPlaces) parts.push('새 가게 ' + c.newPlaces + '곳');
          if (c.newVisits) parts.push('새 방문 ' + c.newVisits + '번');
          if (c.newWishes) parts.push('새 가고 싶은 곳 ' + c.newWishes + '곳');
          if (c.newer) parts.push('더 최근 것으로 바뀌는 기록 ' + c.newer + '개');
          if (need.length) parts.push('사진 ' + need.length + '장');
          if (!parts.length) parts.push('바뀐 내용');
          if (!confirm(parts.join(', ') + '\n이 내용을 합칠까요? 지금 있는 기록은 지워지지 않아요.')) return;
          toast('불러오는 중…');
          return need.reduce(function(chain, id){
            return chain.then(function(){
              var ph = inc.photos[id];
              return Promise.all([fetch(ph.full).then(function(r){ return r.blob(); }), fetch(ph.thumb || ph.full).then(function(r){ return r.blob(); })])
                .then(function(b){ return photoPut({ id:id, full:b[0], thumb:b[1] }); })
                .catch(function(){});
            });
          }, Promise.resolve()).then(function(){
            // 사진을 넣는 동안 바뀌었을 수 있으니 지금 상태에 다시 합친다
            var m = mergeData(state, inc);
            var before = { places:state.places, wishes:state.wishes };
            state.places = m.places; state.wishes = m.wishes;
            if (!save()) { state.places = before.places; state.wishes = before.wishes; return; }
            render();
            toast('백업을 합쳤어요');
          });
        });
      }).catch(function(){ toast('파일을 읽지 못했어요'); });
    };
    input.click();
  }
  function openMenu(){
    var n = state.places.length;
    var est = navigator.storage && navigator.storage.estimate ? navigator.storage.estimate() : Promise.resolve(null);
    est.catch(function(){ return null; }).then(function(e){
      var used = e && e.usage ? ' · 사용 중 ' + (e.usage / 1048576).toFixed(1) + 'MB' : '';
      openActionSheet('백업', '기록과 사진은 이 기기에만 저장돼요. 기기를 바꾸거나 정리하기 전에 백업 파일을 남겨 두세요.' + used, [
        { icon:'📦', label:'백업 파일 만들기', sub:'가게 ' + n + '곳과 사진을 파일 하나로', run:exportBackup },
        { icon:'📥', label:'백업 파일 불러오기', sub:'지금 기록에 합쳐요 (지워지지 않아요)', run:importBackup }
      ]);
    });
  }

  // ---------- 알림 ----------
  var toastTimer = null;
  // 되돌리기를 기다리는 동안 보인 되돌리기 알림. 다른 알림이 떠도 되돌리기 버튼은 남긴다
  var undoToast = null;   // { pd, label, fn, until }
  function showUndo(pd, msg, fn){
    toast(msg, '되돌리기', fn, 7000);
    undoToast = { pd:pd, label:'되돌리기', fn:fn, until:Date.now() + 7000 };
  }
  function toast(msg, actionLabel, onAction, ms){
    var el = $('#fd-toast'), btn = $('button', el);
    ms = ms || 2200;
    if (actionLabel) undoToast = null;
    else if (undoToast && pendingDelete === undoToast.pd && Date.now() < undoToast.until) {
      actionLabel = undoToast.label; onAction = undoToast.fn;
      ms = Math.max(ms, undoToast.until - Date.now());
    }
    $('span', el).textContent = msg;
    btn.hidden = !actionLabel;
    btn.textContent = actionLabel || '';
    btn.onclick = function(){ el.classList.remove('show'); if (onAction) onAction(); };
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, ms);
  }

  // ---------- 이벤트 ----------
  var qInput = $('#fd-q'), qClear = $('#fd-q-clear');
  qInput.addEventListener('input', function(){
    ui.q = qInput.value.trim();
    qClear.hidden = !qInput.value;
    renderList();
  });
  qClear.addEventListener('click', function(e){
    e.preventDefault();
    qInput.value = ''; ui.q = ''; qClear.hidden = true;
    renderList();
  });
  $('#fd-cats').addEventListener('click', function(e){
    var b = e.target.closest('[data-cat]');
    if (!b) return;
    ui.cat = b.dataset.cat;
    renderCats(); renderList();
  });
  $('#fd-sort').addEventListener('click', function(e){
    var b = e.target.closest('[data-sort]');
    if (!b) return;
    ui.sort = b.dataset.sort;
    renderList();
  });
  // 맨 위 바꾸기: 검색어와 종류는 그대로 두고 목록 쪽만 바꾼다 (검색창은 다시 그리지 않는다)
  $('#fd-side').addEventListener('click', function(e){
    var b = e.target.closest('[data-side]');
    if (!b || b.dataset.side === ui.side) return;
    ui.side = b.dataset.side;
    render();
  });
  $('#fd-list').addEventListener('click', function(e){
    var c = e.target.closest('[data-open]');
    if (c) { openDetail(c.dataset.open); return; }
    var wc = e.target.closest('[data-wish]');
    if (wc) openWishDetail(wc.dataset.wish);
  });
  $('#fd-add').addEventListener('click', function(){
    if (ui.side === 'wishes') openWishForm(null);
    else openVisitForm({ mode:'new' });
  });
  $('#fd-menu-btn').addEventListener('click', openMenu);
  $('#fd-map-btn').addEventListener('click', openMap);
  window.addEventListener('pagehide', finishPendingDelete);

  render();
})();
</script>
</body>
</html>
