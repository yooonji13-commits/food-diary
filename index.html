<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>맛집 기록서</title>
<meta name="description" content="사진, 먹은 메뉴, 한줄평, 별점으로 남기는 나만의 맛집 기록">
<meta name="theme-color" content="#FFFBF2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="맛집 기록서">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{ margin:0; padding:0; }
  :root{
    color-scheme:light;
    --bg:#FFFBF2;
    --surface:#FFFEFA;
    --surface-alt:#F5ECDF;
    --ink:#3B2E25;
    --ink-soft:#6B5A4C;
    --muted:#A39181;
    --line:#EFE4D4;
    --accent:#A26B3A;
    --accent-ink:#FFFFFF;
    --accent-soft:#F6EADB;
    --accent-shadow:rgba(162,107,58,.28);
    --star:#E8A83A;
    --star-off:#E9DECF;
    --danger:#CC5F52;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:14px;
    --radius-pill:999px;
    --shadow:0 1px 2px rgba(120,90,50,.04), 0 6px 16px rgba(120,90,50,.05);
    --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-ui);
    font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  }
  body.fd-locked{ overflow:hidden; }
  button{ font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; }
  input, textarea, select{ font:inherit; font-size:16px; color:inherit; }

  @keyframes fd-rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  @keyframes fd-sheet-in{ from{ transform:translateY(100%); } to{ transform:none; } }
  @keyframes fd-fade-in{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes fd-pop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.28); } 100%{ transform:scale(1); } }
  @keyframes fd-spin{ to{ transform:rotate(360deg); } }

  .fd-press{ transition:transform .12s ease, background-color .15s ease, opacity .15s ease; }
  .fd-press:active{ transform:scale(.96); }

  /* ---- layout ---- */
  .fd-app{
    max-width:560px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px);
  }
  .fd-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .fd-head h1{ margin:0; font-size:26px; letter-spacing:-.5px; font-weight:800; }
  .fd-h1-emoji{ display:inline-block; font-size:22px; transform:rotate(-8deg); }
  .fd-sub{ margin:2px 0 0; color:var(--muted); font-size:13.5px; }
  .fd-icon-btn{
    width:40px; height:40px; border-radius:50%; background:var(--surface);
    box-shadow:var(--shadow); display:grid; place-items:center; flex:none;
  }
  .fd-icon-btn svg{ width:20px; height:20px; }

  .fd-search{
    margin-top:16px; display:flex; align-items:center; gap:8px;
    background:var(--surface); border-radius:var(--radius-pill); padding:0 14px; height:46px;
    box-shadow:var(--shadow);
  }
  .fd-search svg{ width:18px; height:18px; color:var(--muted); flex:none; }
  .fd-search input{ flex:1; min-width:0; border:0; outline:0; background:none; height:100%; }
  .fd-search input::placeholder{ color:var(--muted); }
  .fd-search input::-webkit-search-cancel-button{ display:none; }
  .fd-clear{ color:var(--muted); font-size:13px; padding:6px 0 6px 6px; }

  .fd-chips{
    display:flex; gap:6px; overflow-x:auto; margin:12px -16px 0; padding:2px 16px 4px;
    scrollbar-width:none;
  }
  .fd-chips::-webkit-scrollbar{ display:none; }
  .fd-chip{
    flex:none; height:34px; padding:0 13px; border-radius:var(--radius-pill); background:var(--surface);
    border:1px solid var(--line); font-size:14px; color:var(--ink-soft); white-space:nowrap;
  }
  .fd-chip.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }

  .fd-sortbar{ display:flex; align-items:center; justify-content:space-between; margin:14px 2px 10px; }
  .fd-count{ font-size:13px; color:var(--muted); }
  .fd-sortbar-left{ display:flex; align-items:center; gap:8px; }
  .fd-map-btn{ height:32px; padding:0 12px; border-radius:var(--radius-pill); background:var(--surface); border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--accent); }

  /* ---- map ---- */
  .fd-sheet.fd-sheet-map .fd-sheet-body{ padding:0; overflow:hidden; position:relative; }
  .fd-sheet.fd-sheet-map .fd-sheet-inner{ max-width:none; height:100%; }
  .fd-map-wrap{ position:relative; height:100%; background:var(--surface-alt); }
  .fd-map{ position:absolute; inset:0; }
  .fd-map-state{ position:absolute; left:16px; right:16px; top:16px; z-index:3; }
  .fd-map-legend{
    position:absolute; left:12px; top:12px; z-index:2; display:flex; gap:10px; align-items:center;
    background:rgba(255,254,250,.94); border-radius:var(--radius-pill); padding:6px 12px; font-size:12px; color:var(--ink-soft); box-shadow:var(--shadow);
  }
  .fd-map-legend i{ display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  .fd-map-legend .v{ background:var(--accent); }
  .fd-map-legend .w{ background:#FFFEFA; border:2px solid #8FB59A; }
  .fd-map-note{
    position:absolute; left:12px; right:12px; top:52px; z-index:2; text-align:center; pointer-events:none;
  }
  .fd-map-note span{ display:inline-block; background:rgba(59,46,37,.78); color:#fff; font-size:12.5px; border-radius:var(--radius-pill); padding:5px 12px; }
  .fd-pin{
    display:grid; place-items:center; width:40px; height:40px; border-radius:50% 50% 50% 6px; transform:rotate(-45deg);
    background:var(--accent); border:2.5px solid #FFFEFA; box-shadow:0 3px 8px rgba(80,55,30,.3); cursor:pointer; padding:0;
  }
  .fd-pin span{ transform:rotate(45deg); font-size:19px; line-height:1; }
  .fd-pin.wish{ background:#FFFEFA; border-color:#8FB59A; border-width:3px; }
  .fd-pin.on{ outline:3px solid rgba(232,168,58,.7); }
  .fd-map-card{
    position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 14px); z-index:3;
    display:flex; gap:12px; align-items:center; text-align:left; width:auto;
    background:var(--surface); border-radius:var(--radius-lg); padding:10px; box-shadow:0 6px 20px rgba(80,55,30,.18); animation:fd-rise .2s ease both;
  }
  .fd-map-card .fd-thumb{ width:64px; height:64px; font-size:30px; }
  .fd-map-card .fd-go{ flex:none; color:var(--accent); font-size:20px; padding:0 4px; }
  .fd-seg{ display:flex; background:var(--surface-alt); border-radius:var(--radius-pill); padding:3px; }
  .fd-seg button{ font-size:13px; padding:6px 12px; border-radius:var(--radius-pill); color:var(--muted); }
  .fd-seg button.on{ background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }

  /* ---- list ---- */
  .fd-list{ display:flex; flex-direction:column; gap:10px; }
  .fd-card{
    display:flex; gap:12px; padding:12px; background:var(--surface); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); text-align:left; width:100%; animation:fd-rise .25s ease both;
  }
  .fd-thumb{
    width:88px; height:88px; border-radius:var(--radius-md); flex:none; overflow:hidden; position:relative;
    background:var(--surface-alt); display:grid; place-items:center; font-size:36px;
  }
  .fd-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fd-thumb-count{
    position:absolute; right:5px; bottom:5px; font-size:11px; font-weight:600; color:#fff;
    background:rgba(59,46,37,.5); border-radius:var(--radius-pill); padding:1px 7px;
  }
  .fd-card-body{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .fd-card-top{ display:flex; align-items:center; gap:6px; }
  .fd-card-title{ font-weight:700; font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .fd-again{ flex:none; font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:var(--radius-pill); padding:2px 8px; }
  .fd-card-meta{ font-size:12.5px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fd-card-quote{
    font-size:14px; color:var(--ink-soft); margin-top:5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:keep-all;
  }
  .fd-menu-chips{ display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .fd-menu-chip{ font-size:12px; background:var(--surface-alt); color:var(--ink-soft); border-radius:var(--radius-pill); padding:3px 9px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .fd-stars-ro{ display:inline-flex; letter-spacing:-1px; color:var(--star-off); font-size:13px; }
  .fd-stars-ro .on{ color:var(--star); }
  .fd-stars-ro.lg{ font-size:22px; letter-spacing:0; }

  .fd-empty{ text-align:center; padding:56px 20px; color:var(--muted); animation:fd-rise .3s ease both; }
  .fd-empty-emoji{ font-size:56px; }
  .fd-empty h2{ color:var(--ink); font-size:18px; margin:12px 0 4px; }
  .fd-empty p{ margin:0; font-size:14px; }

  .fd-fab{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 20px);
    height:54px; padding:0 26px; border-radius:var(--radius-pill); background:var(--accent); color:var(--accent-ink);
    font-weight:700; font-size:16px; box-shadow:0 8px 22px var(--accent-shadow); z-index:10;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .fd-fab:active{ transform:translateX(-50%) scale(.96); }

  /* ---- sheets ---- */
  .fd-backdrop{ position:fixed; inset:0; background:rgba(59,46,37,.28); z-index:20; animation:fd-fade-in .2s ease; }
  .fd-sheet{
    position:fixed; inset:0; z-index:21; background:var(--bg); display:flex; flex-direction:column;
    animation:fd-sheet-in .28s cubic-bezier(.2,.8,.2,1);
  }
  .fd-sheet.closing{ transition:transform .22s ease; transform:translateY(100%); }
  .fd-sheet-head{
    flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:calc(env(safe-area-inset-top) + 8px) 8px 8px; background:var(--bg);
    border-bottom:1px solid transparent;
  }
  .fd-sheet-head h2{ margin:0; font-size:16.5px; font-weight:700; flex:1; text-align:center; }
  .fd-text-btn{ min-width:64px; height:40px; padding:0 10px; font-size:16px; color:var(--ink-soft); border-radius:var(--radius-pill); }
  .fd-text-btn.strong{ color:var(--accent); font-weight:700; }
  .fd-sheet-body{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    padding:4px 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  .fd-sheet-inner{ max-width:560px; margin:0 auto; }

  /* ---- form ---- */
  .fd-field{ margin-top:22px; }
  .fd-label{ display:block; font-size:13.5px; font-weight:700; color:var(--ink-soft); margin:0 2px 8px; }
  .fd-label small{ font-weight:400; color:var(--muted); margin-left:4px; }
  .fd-input, .fd-textarea{
    width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-md);
    padding:0 14px; height:48px; outline:0; transition:border-color .15s ease;
  }
  .fd-textarea{ height:auto; min-height:88px; padding:12px 14px; resize:none; line-height:1.5; }
  .fd-input:focus, .fd-textarea:focus{ border-color:var(--accent); }
  .fd-input::placeholder, .fd-textarea::placeholder{ color:#C9B9A8; }
  .fd-input.big{ height:54px; font-size:18px; font-weight:700; }
  .fd-counter{ text-align:right; font-size:12px; color:var(--muted); margin-top:4px; }
  .fd-row{ display:flex; gap:8px; }
  .fd-row > *{ flex:1; min-width:0; }
  input[type="date"].fd-input{ -webkit-appearance:none; appearance:none; display:flex; align-items:center; line-height:48px; }

  .fd-photos{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .fd-photo-tile{ position:relative; aspect-ratio:1; border-radius:var(--radius-sm); overflow:hidden; background:var(--surface-alt); }
  .fd-photo-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fd-photo-tile .fd-cover{ position:absolute; left:4px; top:4px; font-size:10.5px; font-weight:700; color:#fff; background:var(--accent); border-radius:var(--radius-pill); padding:1px 7px; }
  .fd-photo-del{
    position:absolute; right:3px; top:3px; width:24px; height:24px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; font-size:13px; line-height:24px; text-align:center;
  }
  .fd-photo-add{
    aspect-ratio:1; border-radius:var(--radius-sm); border:1.5px dashed #DCC7AE; background:var(--surface);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--muted); font-size:12px;
  }
  .fd-photo-add svg{ width:24px; height:24px; color:var(--accent); }
  .fd-spinner{ width:22px; height:22px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--accent); animation:fd-spin .8s linear infinite; margin:auto; position:absolute; inset:0; }
  .fd-hint{ font-size:12px; color:var(--muted); margin:6px 2px 0; }

  .fd-cat-pick{ display:flex; flex-wrap:wrap; gap:6px; }
  .fd-cat-pick .fd-chip{ height:36px; }
  .fd-cat-pick .fd-chip.on{ background:var(--accent); border-color:var(--accent); }

  .fd-rate{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:8px 12px; }
  .fd-stars-in{ display:flex; }
  .fd-stars-in button{ font-size:32px; line-height:1; width:40px; height:42px; color:var(--star-off); transition:color .12s ease; }
  .fd-stars-in button.on{ color:var(--star); }
  .fd-stars-in button.pop{ animation:fd-pop .28s ease; }
  .fd-stars-in.sm button{ font-size:21px; width:27px; height:32px; }
  .fd-rate-word{ font-size:14px; font-weight:700; color:var(--accent); white-space:nowrap; }

  .fd-menus{ display:flex; flex-direction:column; gap:8px; }
  .fd-menu-edit{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:10px; animation:fd-rise .2s ease both; }
  .fd-menu-edit .fd-row{ align-items:center; }
  .fd-menu-edit .fd-input{ height:42px; border-radius:var(--radius-sm); }
  .fd-menu-edit .fd-row + .fd-row{ margin-top:6px; }
  .fd-menu-edit .fd-stars-in{ flex:none; }
  .fd-menu-del{ flex:none !important; width:34px; height:34px; border-radius:50%; color:var(--muted); font-size:15px; }
  .fd-add-line{
    width:100%; height:48px; border-radius:var(--radius-pill); border:1.5px dashed #DCC7AE; color:var(--accent);
    font-weight:700; font-size:14.5px; background:transparent;
  }

  .fd-toggle{ display:flex; gap:8px; }
  .fd-toggle button{
    flex:1; height:48px; border-radius:var(--radius-pill); background:var(--surface); border:1px solid var(--line);
    font-size:14.5px; color:var(--ink-soft);
  }
  .fd-toggle button.on{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; }

  .fd-danger-btn{ width:100%; height:48px; margin-top:28px; border-radius:var(--radius-pill); color:var(--danger); background:var(--surface); border:1px solid var(--line); font-weight:600; }

  /* ---- detail ---- */
  .fd-gallery{ position:relative; margin:4px -16px 0; }
  .fd-gallery-track{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .fd-gallery-track::-webkit-scrollbar{ display:none; }
  .fd-gallery-track button{ flex:none; width:100%; aspect-ratio:4/3; scroll-snap-align:center; background:var(--surface-alt); }
  .fd-gallery-track img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fd-gallery-count{ position:absolute; right:26px; bottom:12px; font-size:12px; font-weight:600; color:#fff; background:rgba(59,46,37,.5); border-radius:var(--radius-pill); padding:2px 10px; pointer-events:none; }
  .fd-detail-hero-empty{ margin:4px 0 0; height:130px; border-radius:var(--radius-lg); background:var(--surface-alt); display:grid; place-items:center; font-size:58px; }
  .fd-detail-title{ margin:18px 0 0; font-size:24px; font-weight:800; letter-spacing:-.4px; word-break:keep-all; }
  .fd-detail-meta{ color:var(--muted); font-size:14px; margin-top:4px; }
  .fd-detail-rate{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .fd-quote-box{
    margin-top:16px; background:var(--surface); border-radius:var(--radius-lg); padding:16px 18px; box-shadow:var(--shadow);
    font-size:17px; font-weight:600; line-height:1.5; word-break:keep-all; position:relative;
  }
  .fd-quote-box::before{ content:"“"; position:absolute; left:12px; top:-8px; font-size:44px; color:var(--accent); opacity:.3; font-family:Georgia,serif; }
  .fd-section-title{ font-size:14px; font-weight:700; color:var(--ink-soft); margin:24px 2px 8px; }
  .fd-menu-list{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden; }
  .fd-menu-item{ padding:13px 16px; }
  .fd-menu-item + .fd-menu-item{ border-top:1px solid var(--line); }
  .fd-menu-item-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .fd-menu-item-name{ font-weight:700; word-break:keep-all; }
  .fd-menu-item-note{ font-size:14px; color:var(--ink-soft); margin-top:3px; }
  .fd-memo{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:14px 16px; white-space:pre-wrap; word-break:break-word; font-size:14.5px; color:var(--ink-soft); }
  .fd-detail-actions{ display:flex; gap:8px; margin-top:28px; }
  .fd-detail-actions button{ flex:1; height:52px; border-radius:var(--radius-pill); font-weight:700; }
  .fd-btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .fd-btn-ghost{ background:var(--surface); border:1px solid var(--line); color:var(--danger); }

  /* ---- photo viewer ---- */
  .fd-viewer{ position:fixed; inset:0; z-index:40; background:#000; animation:fd-fade-in .18s ease; }
  .fd-viewer-track{ display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .fd-viewer-track::-webkit-scrollbar{ display:none; }
  .fd-viewer-track div{ flex:none; width:100%; height:100%; scroll-snap-align:center; display:grid; place-items:center; }
  .fd-viewer-track img{ max-width:100%; max-height:100%; object-fit:contain; }
  .fd-viewer-close{ position:absolute; right:12px; top:calc(env(safe-area-inset-top) + 10px); width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.18); color:#fff; font-size:18px; }
  .fd-viewer-count{ position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 20px); text-align:center; color:#fff; font-size:14px; pointer-events:none; }

  /* ---- action sheet ---- */
  .fd-action-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:31; background:var(--surface); border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    padding:10px 16px calc(env(safe-area-inset-bottom) + 16px); animation:fd-sheet-in .25s cubic-bezier(.2,.8,.2,1);
    max-width:560px; margin:0 auto;
  }
  .fd-action-sheet.closing{ transition:transform .2s ease; transform:translateY(100%); }
  .fd-grab{ width:38px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
  .fd-action-sheet h3{ margin:0 4px 4px; font-size:17px; }
  .fd-action-sheet p{ margin:0 4px 14px; color:var(--muted); font-size:13px; }
  .fd-action{ display:flex; align-items:center; gap:12px; width:100%; padding:14px 8px; border-radius:var(--radius-md); text-align:left; font-size:16px; }
  .fd-action:active{ background:var(--surface-alt); }
  .fd-action span:first-child{ width:40px; height:40px; border-radius:50%; background:var(--accent-soft); display:grid; place-items:center; font-size:19px; flex:none; }
  .fd-action small{ display:block; color:var(--muted); font-size:12.5px; }

  /* ---- toast ---- */
  .fd-toast{
    position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 88px); z-index:50;
    max-width:420px; margin:0 auto; background:rgba(59,46,37,.94); color:#fff; border-radius:var(--radius-pill);
    padding:13px 16px; font-size:14.5px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    opacity:0; transform:translateY(10px); pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .fd-toast.show{ opacity:1; transform:none; pointer-events:auto; }
  .fd-toast button{ color:#F3CC97; font-weight:700; flex:none; padding:4px 2px; }
  [hidden]{ display:none !important; }

  /* ---- place screen ---- */
  .fd-card-sub{ display:flex; align-items:center; gap:6px; margin-top:2px; min-width:0; }
  .fd-visit-n{ font-size:11.5px; font-weight:700; color:var(--ink-soft); background:var(--surface-alt); border-radius:var(--radius-pill); padding:1px 8px; white-space:nowrap; }
  .fd-place-head{ display:flex; align-items:center; gap:12px; margin-top:6px; }
  .fd-place-emoji{ width:58px; height:58px; border-radius:var(--radius-md); background:var(--surface-alt); display:grid; place-items:center; font-size:32px; flex:none; }

  a.fd-link{ color:var(--accent); font-weight:600; }
  .fd-btn-soft{ background:var(--surface); border:1px solid var(--line); color:var(--ink); }
  .fd-detail-actions button{ font-size:14.5px; white-space:nowrap; }

  .fd-visit-quote{ margin:6px 2px 0; font-size:15.5px; font-weight:600; line-height:1.5; word-break:keep-all; }
  .fd-visit .fd-menu-list, .fd-visit .fd-memo{ box-shadow:none; background:var(--bg); border-radius:var(--radius-md); margin-top:8px; }

  .fd-mini-btn{ height:34px; padding:0 14px; border-radius:var(--radius-pill); border:1px solid var(--line); background:var(--surface); font-size:13.5px; color:var(--ink-soft); }
  .fd-mini-btn.danger{ color:var(--danger); }

  /* ---- same place notice ---- */
  .fd-same{ margin-top:10px; background:var(--accent-soft); border-radius:var(--radius-md); padding:12px; animation:fd-rise .2s ease both; }
  .fd-same b{ display:block; font-size:14.5px; color:var(--accent); }
  .fd-same p{ margin:2px 0 4px; font-size:13px; color:var(--ink-soft); }
  .fd-same-item{ display:flex; align-items:center; gap:8px; background:var(--surface); border-radius:var(--radius-sm); padding:8px 8px 8px 12px; margin-top:6px; }
  .fd-same-item div{ flex:1; min-width:0; }
  .fd-same-item strong{ display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fd-same-item small{ display:block; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fd-same-item button{ flex:none; max-width:46%; min-height:36px; padding:4px 12px; border-radius:var(--radius-pill); background:var(--accent); color:var(--accent-ink); font-size:12.5px; font-weight:700; line-height:1.25; word-break:keep-all; }
  .fd-same-new{ margin-top:8px; width:100%; height:38px; border-radius:var(--radius-pill); border:1px solid var(--line); background:var(--surface); font-size:13.5px; color:var(--ink-soft); }
  .fd-form-place{ margin-top:8px; display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:12px 14px; font-weight:700; font-size:16.5px; min-width:0; }
  .fd-form-place span:last-child{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fd-link-edits{ display:flex; flex-direction:column; gap:6px; }
  .fd-link-edit{ align-items:center; }

  /* ---- 다녀온 곳 / 가고 싶은 곳 ---- */
  .fd-side{ display:flex; margin-top:14px; background:var(--surface-alt); border-radius:var(--radius-pill); padding:4px; }
  .fd-side button{ flex:1; min-width:0; height:40px; border-radius:var(--radius-pill); font-size:14.5px; color:var(--muted); white-space:nowrap; }
  .fd-side button.on{ background:var(--surface); color:var(--ink); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .fd-thumb.wish{ width:64px; height:64px; font-size:30px; }
  .fd-link-mark{ flex:none; font-size:11px; font-weight:700; color:var(--ink-soft); background:var(--surface-alt); border-radius:var(--radius-pill); padding:2px 8px; }
  .fd-want-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .fd-want-chips .fd-menu-chip{ font-size:13.5px; padding:6px 12px; background:var(--surface); box-shadow:var(--shadow); }
  .fd-detail-addr{ font-size:13px; color:var(--muted); margin-top:2px; word-break:keep-all; }
  .fd-same-list{ list-style:none; margin:0; padding:0; }
  .fd-same-row{ display:flex; gap:8px; }
  .fd-same-row .fd-same-new{ flex:1; min-width:0; }
  .fd-same-new.strong{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }

  /* ---- 위치 고르기 (카카오) ---- */
  .fd-loc-bar{ display:flex; gap:8px; }
  .fd-loc-bar .fd-input{ flex:1; min-width:0; }
  .fd-loc-bar input::-webkit-search-cancel-button{ display:none; }
  .fd-loc-go{ flex:none; height:48px; padding:0 18px; border-radius:var(--radius-pill); background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:15px; }
  .fd-loc-note{ margin:8px 4px 0; font-size:13px; color:var(--muted); word-break:keep-all; }
  .fd-loc-results{ display:flex; flex-direction:column; gap:6px; margin-top:8px; max-height:300px; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .fd-loc-results:empty{ display:none; }
  .fd-loc-item{ display:block; width:100%; min-width:0; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:10px 14px; }
  .fd-loc-item strong, .fd-loc-item small{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fd-loc-item strong{ font-size:15px; }
  .fd-loc-item small{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .fd-loc-item small.fd-loc-cat{ color:var(--muted); }
  .fd-loc-cancel{ display:block; margin:8px auto 0; height:36px; padding:0 16px; font-size:13.5px; color:var(--muted); border-radius:var(--radius-pill); }
  .fd-loc-picked{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:10px 10px 10px 12px; }
  .fd-loc-picked > div{ flex:1; min-width:0; }
  .fd-loc-picked strong, .fd-loc-picked small{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fd-loc-picked strong{ font-size:15px; }
  .fd-loc-picked small{ font-size:12.5px; color:var(--muted); }
  .fd-loc-picked .fd-mini-btn{ flex:none; padding:0 11px; }
  .fd-loc-pin{ flex:none; font-size:20px; }
  .fd-loc-notice{ background:var(--accent-soft); border-radius:var(--radius-md); padding:12px 14px; animation:fd-rise .2s ease both; }
  .fd-loc-notice b{ display:block; font-size:14px; color:var(--accent); word-break:keep-all; }
  .fd-loc-notice p{ margin:3px 0 0; font-size:13px; color:var(--ink-soft); word-break:keep-all; }
  .fd-loc-notice .fd-mini-btn{ margin-top:8px; }
  .fd-detail-kname{ font-size:12px; color:var(--muted); margin-top:1px; word-break:keep-all; }
</style>

<body>
<div class="fd-app">
  <header class="fd-head">
    <div>
      <h1>맛집 기록서 <span class="fd-h1-emoji">🍙</span></h1>
      <p class="fd-sub" id="fd-stats"></p>
    </div>
    <button class="fd-icon-btn fd-press" id="fd-menu-btn" aria-label="백업과 설정">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>
  <div class="fd-side" id="fd-side" role="tablist">
    <button type="button" data-side="places" role="tab">🍽️ 다녀온 곳</button>
    <button type="button" data-side="wishes" role="tab">💭 가고 싶은 곳</button>
  </div>
  <label class="fd-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="fd-q" type="search" placeholder="가게, 메뉴, 지역으로 찾기" autocomplete="off" enterkeyhint="search">
    <button class="fd-clear" id="fd-q-clear" type="button" hidden>지우기</button>
  </label>
  <div class="fd-chips" id="fd-cats"></div>
  <div class="fd-sortbar">
    <div class="fd-sortbar-left">
      <span class="fd-count" id="fd-count"></span>
      <button type="button" class="fd-map-btn fd-press" id="fd-map-btn">🗺️ 지도</button>
    </div>
    <div class="fd-seg" id="fd-sort">
      <button data-sort="recent">최근 방문</button>
      <button data-sort="rating">별점 높은</button>
    </div>
  </div>
  <main class="fd-list" id="fd-list"></main>
</div>
<button class="fd-fab" id="fd-add"><span style="font-size:19px;line-height:1" id="fd-add-emoji">🍴</span> <span id="fd-add-label">맛집 기록하기</span></button>
<input type="file" id="fd-photo-input" accept="image/*" multiple hidden>
<input type="file" id="fd-import-input" accept="application/json,.json" hidden>
<div class="fd-toast" id="fd-toast"><span></span><button type="button" hidden></button></div>

<script>
(function(){
  'use strict';

  // 카카오 개발자 사이트에서 받은 JavaScript 키를 따옴표 안에 붙여 넣으세요 (비어 있으면 위치 검색·지도만 안 돼요)
  var KAKAO_JS_KEY = '';

  var KEY = 'fd_data_v2';
  var KEY_V1 = 'fd_data_v1';   // 1판 기록. 읽기만 하고 절대 쓰거나 지우지 않는다
  var MAX_PHOTOS = 10;
  var CATS = [
    { name:'한식', emoji:'🍚' }, { name:'일식', emoji:'🍣' }, { name:'중식', emoji:'🥟' },
    { name:'양식', emoji:'🍝' }, { name:'분식', emoji:'🍢' }, { name:'고기', emoji:'🥩' },
    { name:'아시안', emoji:'🍜' }, { name:'카페·디저트', emoji:'🍰' }, { name:'술집', emoji:'🍻' },
    { name:'기타', emoji:'🍴' }
  ];
  var RATE_WORDS = ['별을 눌러요', '별로였어요 😕', '그저 그래요 😐', '괜찮았어요 🙂', '맛있어요! 😋', '인생 맛집 🔥'];

  // ---------- 작은 도구 ----------
  function $(sel, root){ return (root || document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function pad(n){ return String(n).padStart(2, '0'); }
  function today(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function isDate(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function fmtDate(s){
    if (!isDate(s)) return '';
    var p = s.split('-');
    var y = Number(p[0]), thisYear = new Date().getFullYear();
    return (y === thisYear ? '' : y + '. ') + Number(p[1]) + '. ' + Number(p[2]) + '.';
  }
  function catEmoji(name){
    for (var i = 0; i < CATS.length; i++) if (CATS[i].name === name) return CATS[i].emoji;
    return '🍽️';
  }
  function clampRating(v){ v = Math.round(Number(v)); return v >= 1 && v <= 5 ? v : 0; }
  function cmp(a, b){ return a < b ? -1 : a > b ? 1 : 0; }

  // ---------- 저장 (기록은 localStorage, 사진은 IndexedDB) ----------
  // 2판 모양: { version:2, places:[{ ...가게, visits:[방문] }], wishes:[] }
  // 모르는 필드는 그대로 두고, 깨진 값만 안전한 값으로 바꾼다. 줄은 버리지 않는다.
  function str(v){ return typeof v === 'string' ? v : ''; }
  function strList(a){ return Array.isArray(a) ? a.filter(function(x){ return typeof x === 'string' && x; }) : []; }
  function normalizeMenu(m){
    m = (m && typeof m === 'object') ? m : {};
    return Object.assign({}, m, {
      id: typeof m.id === 'string' && m.id ? m.id : uid(),
      name: str(m.name),
      rating: clampRating(m.rating),
      note: str(m.note)
    });
  }
  function normalizeLocation(l){
    if (!l || typeof l !== 'object' || Array.isArray(l)) return null;
    var lat = Number(l.lat), lng = Number(l.lng);
    return Object.assign({}, l, {
      kakaoId: l.kakaoId == null ? '' : String(l.kakaoId),
      placeName: str(l.placeName),
      address: str(l.address),
      // 숫자로 읽을 수 없는 좌표는 null로 둔다 (지도에 0,0으로 찍히지 않게)
      lat: isFinite(lat) && l.lat !== null && l.lat !== '' ? lat : null,
      lng: isFinite(lng) && l.lng !== null && l.lng !== '' ? lng : null
    });
  }
  function normalizeVisit(v){
    v = (v && typeof v === 'object') ? v : {};
    return Object.assign({}, v, {
      id: typeof v.id === 'string' && v.id ? v.id : uid(),
      visitedAt: isDate(v.visitedAt) ? v.visitedAt : '',
      rating: clampRating(v.rating),
      oneLiner: str(v.oneLiner),
      menus: Array.isArray(v.menus) ? v.menus.map(normalizeMenu) : [],
      photos: strList(v.photos),
      memo: str(v.memo),
      createdAt: str(v.createdAt),
      updatedAt: str(v.updatedAt)
    });
  }
  // 방문이 0개인 가게도 그대로 둔다. 가짜 방문을 만들지 않는다
  function normalizePlace(p){
    p = (p && typeof p === 'object') ? p : {};
    return Object.assign({}, p, {
      id: typeof p.id === 'string' && p.id ? p.id : uid(),
      name: str(p.name),
      category: str(p.category),
      area: str(p.area),
      location: normalizeLocation(p.location),
      revisit: p.revisit === 'yes' || p.revisit === 'no' ? p.revisit : '',
      links: strList(p.links),
      memo: str(p.memo),
      fromWishIds: strList(p.fromWishIds),
      visits: Array.isArray(p.visits) ? p.visits.map(normalizeVisit) : [],
      createdAt: str(p.createdAt),
      updatedAt: str(p.updatedAt)
    });
  }
  function normalizeWish(w){
    w = (w && typeof w === 'object') ? w : {};
    return Object.assign({}, w, {
      id: typeof w.id === 'string' && w.id ? w.id : uid(),
      name: str(w.name),
      category: str(w.category),
      area: str(w.area),
      location: normalizeLocation(w.location),
      link: str(w.link),
      wantMenus: strList(w.wantMenus),
      memo: str(w.memo),
      createdAt: str(w.createdAt),
      updatedAt: str(w.updatedAt)
    });
  }
  function normalizeState(s){
    s = (s && typeof s === 'object') ? s : {};
    return Object.assign({}, s, {
      version: 2,
      places: Array.isArray(s.places) ? s.places.map(normalizePlace) : [],
      wishes: Array.isArray(s.wishes) ? s.wishes.map(normalizeWish) : []
    });
  }

  // 1판 기록 하나 → 가게 하나 + 방문 하나. id는 항상 같은 값으로 정한다
  // (가게 id = 1판 id, 방문 id = 1판 id + '_v1') — 같은 1판 백업을 여러 번 불러와도 방문이 늘지 않는다
  var V1_VISIT_FIELDS = ['visitedAt', 'rating', 'oneLiner', 'menus', 'photos', 'memo'];
  function placeFromV1(r){
    r = (r && typeof r === 'object') ? r : {};
    // 숫자 id도 문자열로 바꿔 같은 값을 쓴다. id가 정말 없을 때만 새로 만든다
    var id = (typeof r.id === 'string' && r.id) || (typeof r.id === 'number' && isFinite(r.id)) ? String(r.id) : uid();
    var place = {};
    // 1판에서 모르는 필드는 가게 쪽에 그대로 옮겨 둔다
    Object.keys(r).forEach(function(k){ if (V1_VISIT_FIELDS.indexOf(k) === -1) place[k] = r[k]; });
    Object.assign(place, {
      id: id, name: r.name, category: r.category, area: r.area, revisit: r.revisit,
      location: null, links: [], memo: '', fromWishIds: [],
      createdAt: r.createdAt, updatedAt: r.updatedAt,
      visits: [{
        id: id + '_v1', visitedAt: r.visitedAt, rating: r.rating, oneLiner: r.oneLiner,
        menus: r.menus, photos: r.photos, memo: r.memo, createdAt: r.createdAt, updatedAt: r.updatedAt
      }]
    });
    return normalizePlace(place);
  }
  function placesFromV1(list){ return Array.isArray(list) ? list.map(placeFromV1) : []; }

  // 읽지 못한 원문은 지우지 않고 옆 키에 남겨 둔다. 같은 원문이 이미 남아 있으면 또 만들지 않는다
  function keepUnreadable(key, raw){
    try {
      var k = key + '_unreadable', n = 0, name;
      while ((name = n ? k + '_' + n : k), localStorage.getItem(name) !== null) {
        if (localStorage.getItem(name) === raw) return;
        n++;
      }
      localStorage.setItem(name, raw);
    } catch (e) {}
  }
  function readJSON(key){
    var raw = null;
    try { raw = localStorage.getItem(key); } catch (e) { return { ok:false, missing:true }; }
    if (raw === null) return { ok:false, missing:true };
    try { return { ok:true, data:JSON.parse(raw) }; }
    catch (e) { keepUnreadable(key, raw); return { ok:false, missing:false }; }
  }
  function load(){
    var v2 = readJSON(KEY);
    if (v2.ok) return normalizeState(v2.data);
    if (!v2.missing) return normalizeState(null);
    // 2판이 아직 없으면 1판을 옮긴다. fd_data_v1은 읽기만 한다
    var v1 = readJSON(KEY_V1);
    if (!v1.ok) return normalizeState(null);
    var s = normalizeState({ places: placesFromV1(v1.data && v1.data.places) });
    writeState(s);
    return s;
  }
  function writeState(s){
    try { localStorage.setItem(KEY, JSON.stringify(s)); return true; }
    catch (e) { return false; }
  }
  function save(){
    if (writeState(state)) return true;
    toast('저장하지 못했어요. 저장 공간을 확인해 주세요');
    return false;
  }

  // ---------- 가게·방문 도우미 ----------
  // 방문 순서: 방문한 날 늦은 순, 같으면 만든 때 늦은 순 (문자열 비교, 뺄셈 금지)
  function cmpVisitDesc(a, b){ return cmp(b.visitedAt, a.visitedAt) || cmp(b.createdAt, a.createdAt); }
  function sortedVisits(p){ return p.visits.slice().sort(cmpVisitDesc); }
  function latestVisit(p){ return p.visits.length ? sortedVisits(p)[0] : null; }
  function findVisit(p, vid){
    for (var i = 0; i < p.visits.length; i++) if (p.visits[i].id === vid) return p.visits[i];
    return null;
  }
  function placePhotos(p){
    var ids = [];
    p.visits.forEach(function(v){ v.photos.forEach(function(id){ if (ids.indexOf(id) === -1) ids.push(id); }); });
    return ids;
  }
  function allPhotoIds(places){
    var ids = [];
    places.forEach(function(p){ placePhotos(p).forEach(function(id){ if (ids.indexOf(id) === -1) ids.push(id); }); });
    return ids;
  }
  // 되돌리기를 기다리는 가게의 사진도 쓰는 중으로 본다 (되돌렸을 때 사진이 남아 있어야 한다)
  function photoInUse(pid){
    var places = pendingDelete ? state.places.concat([pendingDelete.place]) : state.places;
    return places.some(function(p){ return p.visits.some(function(v){ return v.photos.indexOf(pid) !== -1; }); });
  }
  // 방문 하나를 바꾸면 그 방문과 가게의 updatedAt을 함께 올린다
  function touch(place, visit){
    var now = new Date().toISOString();
    if (visit) { visit.updatedAt = now; if (!visit.createdAt) visit.createdAt = now; }
    place.updatedAt = now;
    if (!place.createdAt) place.createdAt = now;
    return now;
  }
  function laterOf(a, b){ return cmp(a, b) >= 0 ? a : b; }
  function union(a, b){
    var out = a.slice();
    b.forEach(function(x){ if (out.indexOf(x) === -1) out.push(x); });
    return out;
  }

  // 백업 합치기. 지금 있는 것은 지우지 않는다. 결과와 개수만 돌려주고 state는 건드리지 않는다
  function mergeData(cur, inc){
    var c = { newPlaces:0, newVisits:0, newWishes:0, newer:0 };
    var places = cur.places.map(clone);
    inc.places.forEach(function(ip){
      var idx = -1;
      places.forEach(function(p, i){ if (p.id === ip.id) idx = i; });
      if (idx === -1) {
        places.push(clone(ip));
        c.newPlaces++; c.newVisits += ip.visits.length;
        return;
      }
      var lp = places[idx];
      var incLater = cmp(ip.updatedAt, lp.updatedAt) > 0;
      var replaced = incLater;   // 가게 필드나 방문 중 하나라도 더 최근 것으로 바뀌면 가게 하나로 센다
      var visits = lp.visits.slice();
      ip.visits.forEach(function(iv){
        var j = -1;
        visits.forEach(function(v, k){ if (v.id === iv.id) j = k; });
        if (j === -1) { visits.push(clone(iv)); c.newVisits++; }
        else if (cmp(iv.updatedAt, visits[j].updatedAt) > 0) { visits[j] = clone(iv); replaced = true; }
      });
      if (replaced) c.newer++;
      var base = incLater ? clone(ip) : lp;
      base.links = union(lp.links, ip.links);
      base.fromWishIds = union(lp.fromWishIds, ip.fromWishIds);
      base.visits = visits;
      base.updatedAt = laterOf(lp.updatedAt, ip.updatedAt);
      places[idx] = base;
    });
    // 가고 싶은 곳은 가게를 다 합친 뒤에. 이미 가게가 된 곳은 되살리지 않는다
    var done = [];
    places.forEach(function(p){ done = union(done, p.fromWishIds); });
    var wishes = cur.wishes.map(clone);
    inc.wishes.forEach(function(iw){
      if (done.indexOf(iw.id) !== -1) return;
      var idx = -1;
      wishes.forEach(function(w, i){ if (w.id === iw.id) idx = i; });
      if (idx === -1) { wishes.push(clone(iw)); c.newWishes++; }
      else if (cmp(iw.updatedAt, wishes[idx].updatedAt) > 0) { wishes[idx] = clone(iw); c.newer++; }
    });
    return { places:places, wishes:wishes, counts:c };
  }

  var dbPromise = null;
  function db(){
    if (!dbPromise) dbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open('fd_photos', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('photos', { keyPath:'id' }); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }
  function idb(mode, fn){
    return db().then(function(d){
      return new Promise(function(resolve, reject){
        var tx = d.transaction('photos', mode);
        var out = fn(tx.objectStore('photos'));
        tx.oncomplete = function(){ resolve(out && 'result' in out ? out.result : undefined); };
        tx.onerror = function(){ reject(tx.error); };
        tx.onabort = function(){ reject(tx.error); };
      });
    });
  }
  function photoGet(id){ return idb('readonly', function(s){ return s.get(id); }); }
  function photoPut(rec){ return idb('readwrite', function(s){ s.put(rec); }); }
  function photoDel(ids){
    ids.forEach(forgetUrl);
    if (!ids.length) return Promise.resolve();
    return idb('readwrite', function(s){ ids.forEach(function(id){ s.delete(id); }); }).catch(function(){});
  }

  var urlCache = {};
  function photoUrl(id, kind){
    var key = id + ':' + kind;
    if (urlCache[key]) return Promise.resolve(urlCache[key]);
    return photoGet(id).then(function(rec){
      if (!rec || !rec[kind]) return null;
      return (urlCache[key] = URL.createObjectURL(rec[kind]));
    }).catch(function(){ return null; });
  }
  function forgetUrl(id){
    ['thumb', 'full'].forEach(function(k){
      var key = id + ':' + k;
      if (urlCache[key]) { URL.revokeObjectURL(urlCache[key]); delete urlCache[key]; }
    });
  }
  function hydrateImgs(root){
    $all('img[data-pid]', root).forEach(function(img){
      if (img.getAttribute('src')) return;
      photoUrl(img.dataset.pid, img.dataset.kind || 'thumb').then(function(u){
        if (u) img.src = u;
        else img.style.visibility = 'hidden';
      });
    });
  }

  // 사진은 큰 것 하나(긴 변 1600px)와 정사각 썸네일 하나로 줄여서 담는다
  function loadImage(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){ resolve({ img:img, url:url }); };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image')); };
      img.src = url;
    });
  }
  function toBlob(canvas, q){
    return new Promise(function(resolve, reject){
      canvas.toBlob(function(b){ b ? resolve(b) : reject(new Error('blob')); }, 'image/jpeg', q);
    });
  }
  function processPhoto(file){
    return loadImage(file).then(function(r){
      var img = r.img, w = img.naturalWidth, h = img.naturalHeight;
      var s = Math.min(1, 1600 / Math.max(w, h));
      var c1 = document.createElement('canvas');
      c1.width = Math.round(w * s); c1.height = Math.round(h * s);
      c1.getContext('2d').drawImage(img, 0, 0, c1.width, c1.height);
      var side = Math.min(w, h), T = 360;
      var c2 = document.createElement('canvas');
      c2.width = T; c2.height = T;
      c2.getContext('2d').drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, T, T);
      return Promise.all([toBlob(c1, .84), toBlob(c2, .8)]).then(function(b){
        URL.revokeObjectURL(r.url);
        return { id:'ph_' + uid(), full:b[0], thumb:b[1] };
      });
    });
  }

  // ---------- 상태 ----------
  var state = load();
  // side: 'places' 다녀온 곳 / 'wishes' 가고 싶은 곳. 검색어와 종류는 두 쪽이 함께 쓴다
  var ui = { side:'places', q:'', cat:'', sort:'recent' };

  function findPlace(id){
    for (var i = 0; i < state.places.length; i++) if (state.places[i].id === id) return state.places[i];
    return null;
  }
  function findWish(id){
    for (var i = 0; i < state.wishes.length; i++) if (state.wishes[i].id === id) return state.wishes[i];
    return null;
  }

  // ---------- 목록 ----------
  function starsRO(v, cls){
    var s = '';
    for (var i = 1; i <= 5; i++) s += '<span' + (i <= v ? ' class="on"' : '') + '>★</span>';
    return '<span class="fd-stars-ro ' + (cls || '') + '" aria-label="별점 ' + v + '점">' + s + '</span>';
  }
  // 방문이 없는 가게도 같은 모양으로 그리도록 빈 방문을 쓴다 (저장하지 않는 화면용 값)
  var NO_VISIT = { id:'', visitedAt:'', rating:0, oneLiner:'', menus:[], photos:[], memo:'', createdAt:'', updatedAt:'' };
  function shownVisit(p){ return latestVisit(p) || NO_VISIT; }
  // 목록 별점: 별점이 있는 방문(rating>0) 중 가장 최근 방문의 별점. 없으면 0 (별을 그리지 않는다)
  function listRating(p){
    var vs = sortedVisits(p);
    for (var i = 0; i < vs.length; i++) if (vs[i].rating > 0) return vs[i].rating;
    return 0;
  }
  function lastVisitedAt(p){ var v = latestVisit(p); return v ? v.visitedAt : ''; }
  // 다녀온 곳 검색 범위: 가게 이름·지역·종류·메모·주소 + 모든 방문의 메뉴 이름·한마디·한줄평·메모
  function matches(p, q){
    if (!q) return true;
    var hay = [p.name, p.area, p.category, p.memo, p.location ? p.location.address : ''];
    p.visits.forEach(function(v){
      hay.push(v.oneLiner, v.memo);
      v.menus.forEach(function(m){ hay.push(m.name + ' ' + m.note); });
    });
    return hayHas(hay, q);
  }
  function hayHas(hay, q){
    hay = hay.join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every(function(w){ return !w || hay.indexOf(w) !== -1; });
  }
  // 가고 싶은 곳 검색 범위: 이름·지역·종류·주소·먹어 보고 싶은 메뉴·메모
  function matchesWish(w, q){
    if (!q) return true;
    return hayHas([w.name, w.area, w.category, w.location ? w.location.address : '', w.memo].concat(w.wantMenus), q);
  }
  // 넣은 순서로, 최근에 넣은 것이 위 (createdAt 문자열 비교, 같으면 배열에서 뒤에 있는 것이 위)
  function visibleWishes(){
    return state.wishes.map(function(w, i){ return { w:w, i:i }; }).filter(function(x){
      return (!ui.cat || x.w.category === ui.cat) && matchesWish(x.w, ui.q);
    }).sort(function(a, b){
      return cmp(b.w.createdAt, a.w.createdAt) || cmp(b.i, a.i);
    }).map(function(x){ return x.w; });
  }
  function wishCardHTML(w, i){
    var where = w.area || (w.location && w.location.address) || '';
    var meta = [where, w.category].filter(Boolean).map(esc).join(' · ');
    var chips = w.wantMenus.slice(0, 4).map(function(m){ return '<span class="fd-menu-chip">' + esc(m) + '</span>'; });
    if (w.wantMenus.length > 4) chips.push('<span class="fd-menu-chip">+' + (w.wantMenus.length - 4) + '</span>');
    return '<button class="fd-card fd-press" data-wish="' + esc(w.id) + '" style="animation-delay:' + Math.min(i, 8) * 25 + 'ms">' +
      '<div class="fd-thumb wish">' + catEmoji(w.category) + '</div>' +
      '<div class="fd-card-body">' +
        '<div class="fd-card-top"><span class="fd-card-title">' + esc(w.name || '이름 없는 곳') + '</span>' +
          (w.link ? '<span class="fd-link-mark">🔗 링크</span>' : '') + '</div>' +
        (meta ? '<div class="fd-card-meta">' + meta + '</div>' : '') +
        (chips.length ? '<div class="fd-menu-chips">' + chips.join('') + '</div>' : '') +
      '</div></button>';
  }
  function visible(){
    var list = state.places.filter(function(p){
      return (!ui.cat || p.category === ui.cat) && matches(p, ui.q);
    }).map(function(p){ return { p:p, last:lastVisitedAt(p), r:listRating(p) }; });
    list.sort(function(a, b){
      if (ui.sort === 'rating') {
        if (!a.r !== !b.r) return a.r ? -1 : 1;   // 목록 별점이 없는 가게는 맨 뒤
        var r = cmp(b.r, a.r);
        if (r) return r;
      }
      return cmp(b.last, a.last) || cmp(b.p.createdAt, a.p.createdAt);
    });
    return list.map(function(x){ return x.p; });
  }
  function cardHTML(p, i){
    var vs = sortedVisits(p), v = vs[0] || NO_VISIT, pv = null;
    for (var k = 0; k < vs.length && !pv; k++) if (vs[k].photos.length) pv = vs[k];
    var thumb = pv
      ? '<img data-pid="' + esc(pv.photos[0]) + '" alt="">' + (pv.photos.length > 1 ? '<span class="fd-thumb-count">' + pv.photos.length + '</span>' : '')
      : catEmoji(p.category);
    var r = listRating(p);
    var meta = [p.area, p.category, p.visits.length ? fmtDate(v.visitedAt) : '방문 기록 없음'].filter(Boolean).map(esc).join(' · ');
    var sub = (r ? starsRO(r) : '') + (p.visits.length >= 2 ? '<span class="fd-visit-n">' + p.visits.length + '번 방문</span>' : '');
    // 메뉴 칩: 최근 방문의 메뉴부터, 이름이 같은 메뉴는 한 번만, 최대 4개
    var seen = [], chips = [];
    vs.forEach(function(vv){
      vv.menus.forEach(function(m){
        var key = m.name.trim();
        if (!key || seen.indexOf(key) !== -1 || chips.length >= 4) return;
        seen.push(key);
        chips.push('<span class="fd-menu-chip">' + esc(m.name) + '</span>');
      });
    });
    return '<button class="fd-card fd-press" data-open="' + esc(p.id) + '" style="animation-delay:' + Math.min(i, 8) * 25 + 'ms">' +
      '<div class="fd-thumb">' + thumb + '</div>' +
      '<div class="fd-card-body">' +
        '<div class="fd-card-top"><span class="fd-card-title">' + esc(p.name || '이름 없는 가게') + '</span>' +
          (p.revisit === 'yes' ? '<span class="fd-again">또 갈래요</span>' : '') + '</div>' +
        (sub ? '<div class="fd-card-sub">' + sub + '</div>' : '') +
        '<div class="fd-card-meta">' + meta + '</div>' +
        (v.oneLiner ? '<div class="fd-card-quote">' + esc(v.oneLiner) + '</div>' : '') +
        (chips.length ? '<div class="fd-menu-chips">' + chips.join('') + '</div>' : '') +
      '</div></button>';
  }
  function renderCats(){
    var used = {};
    (ui.side === 'wishes' ? state.wishes : state.places).forEach(function(p){ if (p.category) used[p.category] = true; });
    var html = '<button class="fd-chip' + (ui.cat ? '' : ' on') + '" data-cat="">전체</button>';
    CATS.forEach(function(c){
      if (!used[c.name] && ui.cat !== c.name) return;
      html += '<button class="fd-chip' + (ui.cat === c.name ? ' on' : '') + '" data-cat="' + esc(c.name) + '">' + c.emoji + ' ' + esc(c.name) + '</button>';
    });
    $('#fd-cats').innerHTML = html;
  }
  // 요약 줄: N곳 · 방문 M번 · 평균 ★x.x (평균은 목록 별점이 있는 가게들의 목록 별점 평균)
  function renderStats(){
    if (ui.side === 'wishes') {
      $('#fd-stats').textContent = state.wishes.length ? '가고 싶은 곳 ' + state.wishes.length + '곳' : '가 보고 싶은 곳을 모아 두세요';
      return;
    }
    var n = state.places.length, m = 0;
    state.places.forEach(function(p){ m += p.visits.length; });
    var rated = state.places.map(listRating).filter(Boolean);
    var avg = rated.length ? rated.reduce(function(s, r){ return s + r; }, 0) / rated.length : 0;
    $('#fd-stats').textContent = n
      ? n + '곳 · 방문 ' + m + '번' + (rated.length ? ' · 평균 ★' + avg.toFixed(1) : '')
      : '맛있게 먹은 곳을 하나씩 남겨 보세요';
  }
  // 검색창은 건드리지 않고 목록만 다시 그린다
  function renderList(){
    if (ui.side === 'wishes') { renderWishList(); return; }

    $('#fd-sort').style.visibility = state.places.length ? '' : 'hidden';

    if (!state.places.length) {
      el.innerHTML = '<div class="fd-empty"><div class="fd-empty-emoji">🍜🍙🍰</div><h2>아직 기록한 맛집이 없어요</h2><p>아래 버튼을 눌러 첫 맛집을 남겨 보세요</p></div>';
    } else if (!list.length) {
      el.innerHTML = '<div class="fd-empty"><div class="fd-empty-emoji">🔍</div><h2>찾는 맛집이 없어요</h2><p>다른 말로 찾아보거나 분류를 바꿔 보세요</p></div>';

  function renderWishList(){

  // 맨 위 바꾸기와 아래 버튼을 지금 쪽에 맞춘다. 검색창은 건드리지 않는다

  }
  function render(){ renderSide(); renderStats(); renderCats(); renderList(); }

  // ---------- 시트 ----------
  var openCount = 0;
  function lock(){ if (openCount++ === 0) document.body.classList.add('fd-locked'); }
  function unlock(){ if (--openCount <= 0) { openCount = 0; document.body.classList.remove('fd-locked'); } }

  function openSheet(o){
    var el = document.createElement('div');
    el.className = 'fd-sheet';
    el.innerHTML =
      '<div class="fd-sheet-head">' +
        '<button class="fd-text-btn" data-act="close">' + (o.leftLabel || '닫기') + '</button>' +
        '<h2>' + esc(o.title) + '</h2>' +
        (o.right || '<span class="fd-text-btn"></span>') +
      '</div>' +
      '<div class="fd-sheet-body"><div class="fd-sheet-inner"></div></div>';
    $('.fd-sheet-inner', el).innerHTML = o.body;
    document.body.appendChild(el);
    lock();
    var body = $('.fd-sheet-body', el), head = $('.fd-sheet-head', el);
    body.addEventListener('scroll', function(){
      head.style.borderBottomColor = body.scrollTop > 4 ? 'var(--line)' : 'transparent';
    }, { passive:true });
    el.close = function(){
      if (el.closed) return;
      el.closed = true;
      if (document.activeElement && el.contains(document.activeElement)) document.activeElement.blur();
      el.classList.add('closing');
      setTimeout(function(){ el.remove(); }, 230);
      unlock();
    };
    return el;
  }

  function openActionSheet(title, desc, actions){

    el.innerHTML = '<div class="fd-grab"></div><h3>' + esc(title) + '</h3>' + (desc ? '<p>' + esc(desc) + '</p>' : '') +
      actions.map(function(a, i){

          (a.sub ? '<small>' + esc(a.sub) + '</small>' : '') + '</span></button>';
      }).join('');
    document.body.appendChild(bd); document.body.appendChild(el);

      el.classList.add('closing'); bd.style.transition = 'opacity .2s'; bd.style.opacity = '0';
      setTimeout(function(){ el.remove(); bd.remove(); }, 210);
      unlock();
    }

    el.addEventListener('click', function(e){
      var b = e.target.closest('[data-i]');

  // ---------- 가게 화면 ----------
  // http:// 또는 https://로 시작하는 링크만 새 창으로 연다. 나머지는 글자로만 보여 준다
  function isWebLink(s){ return /^https?:\/\//i.test(s); }
  function linkHTML(l){
    return isWebLink(l)
      ? '<a class="fd-link" href="' + esc(l) + '" target="_blank" rel="noopener noreferrer">🔗 ' + esc(l) + '</a>'
      : '<span class="fd-link">' + esc(l) + '</span>';
  }
  function revisitToggleHTML(cur, attr){
    return '<div class="fd-toggle">' +
      '<button type="button" ' + attr('yes') + (cur === 'yes' ? ' class="on"' : '') + '>😋 또 갈래요</button>' +

  function galleryHTML(v){

          (m.note ? '<div class="fd-menu-item-note">' + esc(m.note) + '</div>' : '') + '</div>';

  function detailHTML(p){
    var meta = [p.category ? catEmoji(p.category) + ' ' + p.category : '', p.area].filter(Boolean).map(esc).join(' · ');
    // 위치가 있으면 주소. 카카오 정식 이름이 사용자가 적은 이름과 다르면 작게 함께

  function fillDetail(sheet, p){
    var inner = $('.fd-sheet-inner', sheet);

    $all('.fd-gallery', inner).forEach(function(g){
      var track = $('.fd-gallery-track', g), count = $('.fd-gallery-count', g);
      if (!count) return;
      var n = track.children.length;
      track.addEventListener('scroll', function(){
        var i = Math.round(track.scrollLeft / track.clientWidth);
        count.textContent = (i + 1) + ' / ' + n;
      }, { passive:true });
    });

  // 열려 있는 가게 화면을 지금 값으로 다시 채운다. 가게가 없어졌으면 닫는다
  function refreshDetail(id){
    $all('.fd-sheet[data-detail]').forEach(function(s){
      if (s.closed || s.dataset.detail !== id) return;
      var p = findPlace(id);
      if (p) fillDetail(s, p); else s.close();
    });
  }
  // 가게 하나를 새 값으로 바꿔 저장한다. 저장하지 못하면 되돌리고 false
  function replacePlace(cur, next){
    var i = state.places.indexOf(cur);
    if (i === -1) return false;
    state.places[i] = next;
    if (!save()) { state.places[i] = cur; return false; }
    return true;
  }
  // 가게 화면의 또 갈래요 바꾸기. 같은 쪽을 다시 누르면 비운다. 바로 저장한다
  function setRevisit(id, val){
    var cur = findPlace(id);
    if (!cur) return null;
    var next = clone(cur);
    next.revisit = cur.revisit === val ? '' : val;
    touch(next, null);
    if (!replacePlace(cur, next)) return null;
    renderList();
    return next.revisit;
  }
  function openDetail(id){
    var p = findPlace(id);
    if (!p) return;
    var sheet = openSheet({ title:'', leftLabel:'‹ 목록', body:'' });
    sheet.dataset.detail = id;
    fillDetail(sheet, p);
    sheet.addEventListener('click', function(e){
      var b = e.target.closest('[data-act],[data-view]');
      if (!b) return;
      var cur = findPlace(id), act = b.dataset.act;
      if (act === 'close') { sheet.close(); return; }
      if (!cur) { sheet.close(); return; }
      if (act === 'revisit') {
        var now = setRevisit(id, b.dataset.val);
        if (now != null) $all('[data-act="revisit"]', sheet).forEach(function(x){ x.classList.toggle('on', x.dataset.val === now); });
      }
      else if (act === 'add-visit') openVisitForm({ mode:'add', placeId:id });
      else if (act === 'edit-place') openPlaceForm(id);
      else if (act === 'edit-visit') openVisitForm({ mode:'edit', placeId:id, visitId:b.dataset.vid });
      else if (act === 'del-visit') deleteVisit(id, b.dataset.vid);
      else if (act === 'delete-place') {
        var n = cur.visits.length;
        if (!confirm('‘' + (cur.name || '이름 없는 가게') + '’' + (n ? '와 방문 기록 ' + n + '번을 모두' : '을') + ' 지울까요?')) return;
        removePlace(id);
      }
      else if (b.dataset.view != null) {
        var v = findVisit(cur, b.dataset.vid);
        if (v) openViewer(v.photos, Number(b.dataset.view));
      }

  // ---------- 지우기와 되돌리기 ----------
  // 되돌리기를 기다리는 지우기는 하나뿐이다. place는 사진 확인용으로 { visits:[...] } 모양을 갖는다
  var pendingDelete = null;
  function finishPendingDelete(){
    if (!pendingDelete) return;
    var pd = pendingDelete;
    clearTimeout(pd.timer);
    pendingDelete = null;
    if (undoToast && undoToast.pd === pd) { undoToast = null; $('#fd-toast button').hidden = true; }
    // 다른 방문이 같은 사진을 쓰지 않을 때만 지운다
    photoDel(placePhotos(pd.place).filter(function(pid){ return !photoInUse(pid); }));
  }
  function startPendingDelete(pd, msg){
    pd.timer = setTimeout(finishPendingDelete, 7000);
    pendingDelete = pd;
    showUndo(pd, msg, function(){
      if (pendingDelete !== pd) return;
      if (!pd.restore()) return;   // 저장하지 못하면 되돌리기를 그대로 남긴다
      clearTimeout(pd.timer);
      pendingDelete = null;
      undoToast = null;
      render();
      refreshDetail(pd.placeId);
      toast('되돌렸어요 🙌');
    });
  }
  function removePlace(id){
    finishPendingDelete();
    var idx = -1;
    state.places.forEach(function(p, i){ if (p.id === id) idx = i; });
    if (idx === -1) return;
    var place = state.places.splice(idx, 1)[0];
    if (!save()) { state.places.splice(idx, 0, place); return; }
    render();
    refreshDetail(id);
    startPendingDelete({ place:place, placeId:id, restore:function(){
      if (findPlace(id)) return true;
      state.places.splice(Math.min(idx, state.places.length), 0, place);
      if (save()) return true;
      state.places.splice(state.places.indexOf(place), 1);
      return false;
    } }, '기록을 지웠어요');
  }
  function removeVisit(placeId, vid){
    finishPendingDelete();
    var cur = findPlace(placeId), v = cur && findVisit(cur, vid);
    if (!v) return;
    var idx = cur.visits.indexOf(v);
    var next = clone(cur);
    next.visits.splice(idx, 1);
    touch(next, null);
    if (!replacePlace(cur, next)) return;
    render();
    refreshDetail(placeId);
    startPendingDelete({ place:{ visits:[v] }, placeId:placeId, restore:function(){
      var c = findPlace(placeId);
      if (!c) return false;
      if (findVisit(c, v.id)) return true;
      var r = clone(c);
      r.visits.splice(Math.min(idx, r.visits.length), 0, clone(v));
      touch(r, null);
      return replacePlace(c, r);
    } }, '방문 기록을 지웠어요');
  }
  // 방문 지우기. 가게의 마지막 방문이면 가게까지 지운다
  function deleteVisit(placeId, vid){
    var p = findPlace(placeId), v = p && findVisit(p, vid);
    if (!v) return;
    if (p.visits.length <= 1) {
      if (!confirm('마지막 방문 기록이라 ‘' + (p.name || '이름 없는 가게') + '’ 가게까지 지워져요. 지울까요?')) return;
      removePlace(placeId);
      return;
    }
    if (!confirm((v.visitedAt ? fmtDate(v.visitedAt) + ' ' : '') + '방문 기록을 지울까요?')) return;
    removeVisit(placeId, vid);
  }

  function openViewer(ids, start){
    var el = document.createElement('div');
    el.className = 'fd-viewer';
    el.innerHTML = '<div class="fd-viewer-track">' + ids.map(function(id){
      return '<div><img data-pid="' + esc(id) + '" data-kind="full" alt=""></div>';
    }).join('') + '</div><div class="fd-viewer-count"></div><button class="fd-viewer-close" aria-label="닫기">✕</button>';

  // ---------- 같은 가게 알아보기 ----------
  // 이름 비교: 앞뒤·안쪽 공백을 무시하고 대소문자를 가리지 않는다
  function normName(s){ return String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase(); }
  // 같은 가게일 수 있는 다녀온 곳 후보. cand = { name, location }. 규칙은 maybeSame 하나
  function samePlaceCandidates(cand, excludeId){
    return state.places.filter(function(p){ return p.id !== excludeId && maybeSame(cand, p); });
  }
  // 같은 곳일 수 있는 가고 싶은 곳 후보. 규칙은 samePlaceCandidates와 같다
  function sameWishCandidates(cand, excludeId){
    return state.wishes.filter(function(w){ return w.id !== excludeId && maybeSame(cand, w); });
  }
  // 두 곳(가게·가고 싶은 곳·폼 값)이 같은 곳일 수 있는지. 판단 규칙은 여기 한 곳에만 둔다.
  //  - 둘 다 위치(kakaoId)가 있으면 kakaoId가 같을 때만 같은 곳이다. 이름이 같아도 지점이 다르면 다른 곳
  //  - 어느 한쪽이라도 위치가 없으면 이름을 본다 (이름이 같으면 확정하지 않고 사용자에게 묻는다)
  function locId(x){ return x && x.location && x.location.kakaoId ? String(x.location.kakaoId) : ''; }
  function maybeSame(a, b){
    var ka = locId(a), kb = locId(b);
    if (ka && kb) return ka === kb;
    var key = normName(a && a.name);
    return !!key && normName(b && b.name) === key;
  }
  // 알림을 다시 띄울지 가르는 열쇠: 이름과 위치가 그대로면 같은 열쇠다
  function sameKeyOf(c){
    var n = normName(c && c.name), k = locId(c);
    return n || k ? n + '#' + k : '';
  }
  function wishMetaHTML(w){

  // 새 가게로 쓰는 방문 폼(또는 다녀온 가게에 붙인 뒤)에서 가고 싶은 곳이 걸렸을 때 묻는 칸

  function wishMovingHTML(w, fixed){

  // ---------- 카카오 (위치 검색, 지도) ----------
  // SDK는 위치 검색이나 지도를 처음 쓸 때만 불러온다. 앱을 열 때는 불러오지 않는다.
  // 실패한 약속은 버려서 다음에 다시 시도할 수 있게 한다
  var KAKAO_TIMEOUT_MS = 8000;
  var kakaoPromise = null;
  function kakaoReady(){ return !!(window.kakao && window.kakao.maps && window.kakao.maps.services); }
  // 지금 바로 알 수 있는 못 쓰는 이유: 'nokey' / 'offline' / ''
  function kakaoBlocked(){
    if (kakaoReady()) return '';
    if (!KAKAO_JS_KEY) return 'nokey';
    if (navigator.onLine === false) return 'offline';
    return '';
  }
  function kakaoError(reason){ var e = new Error('kakao:' + reason); e.reason = reason; return e; }
  function loadKakao(timeoutMs){
    if (kakaoReady()) return Promise.resolve(window.kakao);
    if (kakaoPromise) return kakaoPromise;
    var p = new Promise(function(resolve, reject){
      var why = kakaoBlocked();
      if (why) { reject(kakaoError(why)); return; }
      var done = false, script = null;
      var timer = setTimeout(function(){ fail('timeout'); }, timeoutMs || KAKAO_TIMEOUT_MS);
      function fail(reason){
        if (done) return;
        done = true; clearTimeout(timer);
        if (script && !window.kakao) script.remove();
        reject(kakaoError(reason));
      }
      function start(){
        try {
          window.kakao.maps.load(function(){
            if (done) return;
            if (!kakaoReady()) { fail('script'); return; }
            done = true; clearTimeout(timer);
            resolve(window.kakao);
          });
        } catch (e) { fail('script'); }
      }
      // 앞선 시도에서 스크립트가 늦게 들어와 있으면 다시 넣지 않고 시작만 한다
      if (window.kakao && window.kakao.maps && typeof window.kakao.maps.load === 'function') { start(); return; }
      script = document.createElement('script');
      script.async = true;
      script.onerror = function(){ fail(navigator.onLine === false ? 'offline' : 'script'); };
      script.onload = function(){
        if (done) return;
        if (window.kakao && window.kakao.maps && typeof window.kakao.maps.load === 'function') start();
        else fail('script');
      };
      script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(KAKAO_JS_KEY) + '&libraries=services&autoload=false';
      document.head.appendChild(script);
    });
    kakaoPromise = p;
    p.catch(function(){ if (kakaoPromise === p) kakaoPromise = null; });
    return p;
  }
  // 카카오를 못 쓸 때 위치 검색 자리(와 지도)에 보이는 안내
  function kakaoNoticeHTML(err, retry){
    var why = err && err.reason;
    var sub = why === 'nokey' ? 'index.html의 KAKAO_JS_KEY에 카카오 JavaScript 키를 넣으면 쓸 수 있어요.'
      : why === 'offline' ? '인터넷에 연결되어 있지 않아요. 연결되면 다시 해 보세요.'
      : '카카오 지도를 불러오지 못했어요. 잠시 뒤 다시 해 보세요.';
    return '<div class="fd-loc-notice"><b>🗺️ 지도를 쓰려면 인터넷 연결과 카카오 키가 필요해요</b><p>' + esc(sub) + ' 위치 없이도 기록은 그대로 저장돼요.</p>' +
      (retry && why !== 'nokey' ? '<button type="button" class="fd-mini-btn fd-press" data-loc-act="retry">다시 해 보기</button>' : '') + '</div>';
  }
  // ---------- 지도 ----------
  // 다녀온 곳과 가고 싶은 곳을 함께 핀으로 보여 준다. 지금 걸린 종류·검색어를 그대로 따른다
  function hasPoint(x){
    var l = x.location;
    return !!(l && typeof l.lat === 'number' && typeof l.lng === 'number' && isFinite(l.lat) && isFinite(l.lng));
  }
  function mapItems(){
    var items = [];
    visible().forEach(function(p){ items.push({ kind:'place', id:p.id, it:p }); });
    visibleWishes().forEach(function(w){ items.push({ kind:'wish', id:w.id, it:w }); });
    return items;
  }
  function mapCardHTML(x){
    var it = x.it, thumb = catEmoji(it.category), sub = '';
    if (x.kind === 'place') {
      var vs = sortedVisits(it);
      for (var k = 0; k < vs.length; k++) if (vs[k].photos.length) { thumb = '<img data-pid="' + esc(vs[k].photos[0]) + '" alt="">'; break; }
      var r = listRating(it);
      sub = (r ? starsRO(r) + ' ' : '') + (it.visits.length >= 2 ? '<span class="fd-visit-n">' + it.visits.length + '번 방문</span>' : '');
    } else {
      sub = '<span class="fd-link-mark">💭 가고 싶은 곳</span>';
    }
    return '<div class="fd-thumb">' + thumb + '</div>' +
      '<div class="fd-card-body">' +
        '<div class="fd-card-top"><span class="fd-card-title">' + esc(it.name || '이름 없는 곳') + '</span></div>' +
        (sub ? '<div class="fd-card-sub">' + sub + '</div>' : '') +
        (it.location && it.location.address ? '<div class="fd-card-meta">📍 ' + esc(it.location.address) + '</div>' : '') +

  }
  function openMap(){
    var sheet = openSheet({ title:'🗺️ 지도',
      body:'<div class="fd-map-wrap"><div class="fd-map" id="fd-map"></div>' +
        '<div class="fd-map-legend"><span><i class="v"></i>다녀온 곳</span><span><i class="w"></i>가고 싶은 곳</span></div>' +
        '<div class="fd-map-note" id="fd-map-note" hidden></div>' +
        '<div class="fd-map-state" id="fd-map-state" hidden></div>' +
        '<button type="button" class="fd-map-card fd-press" id="fd-map-card" hidden></button></div>' });
    sheet.classList.add('fd-sheet-map');
    var mapEl = $('#fd-map', sheet), stateEl = $('#fd-map-state', sheet), noteEl = $('#fd-map-note', sheet), cardEl = $('#fd-map-card', sheet);
    var map = null, picked = null, pinEls = [];

    function showState(html){ stateEl.innerHTML = html; stateEl.hidden = !html; }
    function hideCard(){
      picked = null; cardEl.hidden = true;
      pinEls.forEach(function(p){ p.classList.remove('on'); });
    }
    function pick(x, pinEl){
      picked = x;
      pinEls.forEach(function(p){ p.classList.toggle('on', p === pinEl); });
      cardEl.innerHTML = mapCardHTML(x);
      cardEl.hidden = false;
      hydrateImgs(cardEl);
    }
    function draw(kakao){
      if (sheet.closed) return;
      var items = mapItems(), shown = items.filter(function(x){ return hasPoint(x.it); });
      var missing = items.length - shown.length;
      map = new kakao.maps.Map(mapEl, { center:new kakao.maps.LatLng(37.5665, 126.978), level:8 });
      kakao.maps.event.addListener(map, 'click', hideCard);
      var bounds = new kakao.maps.LatLngBounds();
      shown.forEach(function(x){
        var pos = new kakao.maps.LatLng(x.it.location.lat, x.it.location.lng);
        var pin = document.createElement('button');
        pin.type = 'button';
        pin.className = 'fd-pin' + (x.kind === 'wish' ? ' wish' : '');
        pin.setAttribute('aria-label', x.it.name || '이름 없는 곳');
        pin.innerHTML = '<span>' + catEmoji(x.it.category) + '</span>';
        pin.addEventListener('click', function(e){ e.stopPropagation(); pick(x, pin); });
        pinEls.push(pin);
        new kakao.maps.CustomOverlay({ map:map, position:pos, content:pin, xAnchor:0.5, yAnchor:1.1, clickable:true });
        bounds.extend(pos);
      });
      if (shown.length === 1) { map.setLevel(4); map.setCenter(bounds.getSouthWest()); }
      else if (shown.length > 1) map.setBounds(bounds, 60, 40, 120, 40);
      var notes = [];
      if (!shown.length) notes.push('지도에 보일 곳이 없어요 🥲');
      if (missing) notes.push('위치가 없는 ' + missing + '곳은 지도에 안 나와요');
      noteEl.innerHTML = notes.map(function(n){ return '<span>' + esc(n) + '</span>'; }).join('<br>');
      noteEl.hidden = !notes.length;
    }
    function start(){
      showState('<div class="fd-loc-notice"><b>🗺️ 카카오 지도를 불러오는 중…</b></div>');
      loadKakao().then(function(kakao){
        if (sheet.closed) return;
        showState('');
        // 시트가 다 올라온 뒤 크기를 재야 지도가 제대로 그려진다
        setTimeout(function(){ draw(kakao); }, 300);
      }, function(err){
        if (sheet.closed) return;
        showState(kakaoNoticeHTML(err, true));
      });
    }

    sheet.addEventListener('click', function(e){
      var b = e.target.closest('[data-act],[data-loc-act]');
      if (b && b.dataset.act === 'close') { sheet.close(); return; }
      if (b && b.dataset.locAct === 'retry') { start(); return; }
      if (e.target.closest('#fd-map-card') && picked) {
        var x = picked;
        hideCard();
        if (x.kind === 'place') openDetail(x.id); else openWishDetail(x.id);
      }
    });
    start();
  }

  // 카카오 분류 → 앱 종류. 위에서부터 보고 처음 맞는 것. 아무것도 맞지 않으면 ''
  function kakaoCategory(categoryName, groupCode){
    var name = typeof categoryName === 'string' ? categoryName : '';
    var code = typeof groupCode === 'string' ? groupCode : '';
    var rules = [
      ['카페·디저트', ['카페', '디저트', '베이커리']],
      ['술집', ['술집']],
      ['분식', ['분식']],
      ['고기', ['육류,고기', '고기']],
      ['한식', ['한식']],
      ['일식', ['일식']],
      ['중식', ['중식']],
      ['양식', ['양식']],
      ['아시안', ['아시아음식']]
    ];
    if (code === 'CE7') return '카페·디저트';
    for (var i = 0; i < rules.length; i++) {
      for (var j = 0; j < rules[i][1].length; j++) if (name.indexOf(rules[i][1][j]) !== -1) return rules[i][0];
    }
    if (code === 'FD6' || name.indexOf('음식점') !== -1) return '기타';
    return '';
  }
  // 카카오 장소 검색 결과 하나 → 저장할 위치 모양
  function locationFromKakao(r){
    return normalizeLocation({
      kakaoId: String(r.id),
      placeName: str(r.place_name),
      address: str(r.road_address_name) || str(r.address_name),
      lat: Number(r.y),
      lng: Number(r.x)
    });
  }
  // 카카오 정식 이름이 사용자가 적은 이름과 다를 때만 그 이름 (공백·대소문자는 같은 것으로 본다)
  function kakaoNameIfDiffers(x){
    var l = x && x.location;
    return l && l.placeName && normName(l.placeName) !== normName(x.name) ? l.placeName : '';
  }
  function locDetailHTML(x){

    return (l.address ? '<div class="fd-detail-addr">📍 ' + esc(l.address) + '</div>' : '') +
      (kn ? '<div class="fd-detail-kname">카카오 지도 이름 · ' + esc(kn) + '</div>' : '');

  // 위치 고르기 칸. 폼 HTML에 locPickerHTML()을 넣고, 시트를 연 뒤 mountLocPicker로 붙인다.
  // 이 칸 안의 위치 카드·검색 결과·안내만 고쳐 그린다. 폼과 검색창은 다시 그리지 않는다
  function locPickerHTML(){
    return '<div class="fd-field fd-loc" data-loc-root><label class="fd-label">위치 <small>카카오 지도에서 찾아 붙여요 · 없어도 돼요</small></label>' +
      '<div data-loc-view></div>' +
      '<div class="fd-loc-panel" data-loc-panel hidden>' +
        '<div class="fd-loc-bar" data-loc-bar><input class="fd-input" type="search" data-loc-q placeholder="가게 이름이나 동네로 찾기" maxlength="60" autocomplete="off" enterkeyhint="search">' +
          '<button type="button" class="fd-loc-go fd-press" data-loc-act="go">찾기</button></div>' +
        '<div data-loc-msg></div>' +
        '<div class="fd-loc-results" data-loc-results></div>' +

  function locPickedHTML(l){
    return '<div class="fd-loc-picked"><span class="fd-loc-pin">📍</span><div><strong>' + esc(l.placeName || '고른 위치') + '</strong>' +
      (l.address ? '<small>' + esc(l.address) + '</small>' : '') + '</div>' +
      '<button type="button" class="fd-mini-btn fd-press" data-loc-act="open">바꾸기</button>' +
      '<button type="button" class="fd-mini-btn fd-press" data-loc-act="remove">떼기</button></div>';

  function kakaoCatLabel(s){
    var parts = String(s || '').split('>').map(function(x){ return x.trim(); }).filter(Boolean);
    if (parts.length > 1 && parts[0] === '음식점') parts.shift();
    return parts.slice(-2).join(' › ');
  }
  function locResultHTML(r, i){
    var addr = r.road_address_name || r.address_name || '';
    var cat = kakaoCatLabel(r.category_name);
    return '<button type="button" class="fd-loc-item fd-press" data-loc-pick="' + i + '" data-kakao-id="' + esc(r.id) + '">' +
      '<strong>' + esc(r.place_name || '이름 없는 곳') + '</strong>' +
      (addr ? '<small>' + esc(addr) + '</small>' : '') +
      (cat ? '<small class="fd-loc-cat">' + esc(cat) + '</small>' : '') + '</button>';
  }
  // o = { get(): 지금 위치, query(): 처음 검색어(이름 칸), onPick(location, 카카오 결과), onRemove() }
  function mountLocPicker(root, o){
    var view = $('[data-loc-view]', root), panel = $('[data-loc-panel]', root), bar = $('[data-loc-bar]', root);
    var q = $('[data-loc-q]', root), msg = $('[data-loc-msg]', root), res = $('[data-loc-results]', root);
    var results = [], seq = 0;
    function note(t){ msg.innerHTML = t ? '<p class="fd-loc-note">' + esc(t) + '</p>' : ''; }
    function drawView(){
      var l = o.get();
      view.innerHTML = l ? locPickedHTML(l) : '<button type="button" class="fd-add-line fd-press" data-loc-act="open">📍 위치 검색</button>';
    }
    function clearResults(){ results = []; res.innerHTML = ''; }
    function close(){ seq++; panel.hidden = true; view.hidden = false; clearResults(); note(''); }
    function fail(err){
      if (panel.hidden) return;
      bar.hidden = true; clearResults();
      msg.innerHTML = kakaoNoticeHTML(err, true);
    }
    function open(){
      view.hidden = true; panel.hidden = false; bar.hidden = false;
      clearResults(); note('');
      var why = kakaoBlocked();
      if (why) { fail(kakaoError(why)); return; }   // 키패드를 올리지 않고 안내만
      if (!q.value.trim()) q.value = String(o.query() || '').trim();
      q.focus();   // 누른 순간에 바로 (아이폰은 나중에 focus하면 키패드가 안 올라온다)
      prepare(!!q.value.trim());
    }
    function prepare(thenSearch){
      var my = ++seq;
      note('카카오 지도를 불러오는 중…');
      loadKakao().then(function(){
        if (my !== seq || panel.hidden) return;
        note('');
        if (thenSearch) search();
      }, function(err){ if (my === seq) fail(err); });
    }
    function search(){
      var text = q.value.trim();
      if (!text) { note('찾을 가게 이름을 적어 주세요'); return; }
      var my = ++seq;
      bar.hidden = false;
      note('찾는 중…');
      loadKakao().then(function(k){
        if (my !== seq || panel.hidden) return;
        var guard = setTimeout(function(){ if (my === seq && !panel.hidden) { clearResults(); note('검색하지 못했어요. 잠시 뒤 다시 해 보세요'); } }, KAKAO_TIMEOUT_MS);
        try {
          new k.maps.services.Places().keywordSearch(text, function(data, status){
            clearTimeout(guard);
            if (my !== seq || panel.hidden) return;
            var S = k.maps.services.Status || {};
            if (status === (S.OK || 'OK') && Array.isArray(data) && data.length) {
              results = data;
              note('');
              res.innerHTML = data.map(locResultHTML).join('');
              res.scrollTop = 0;
            } else {
              clearResults();
              note(status === (S.ZERO_RESULT || 'ZERO_RESULT') || (Array.isArray(data) && !data.length)
                ? '‘' + text + '’ 검색 결과가 없어요. 다른 말로 찾아보세요' : '검색하지 못했어요. 잠시 뒤 다시 해 보세요');
            }
          });
        } catch (e) {
          clearTimeout(guard);
          clearResults(); note('검색하지 못했어요. 잠시 뒤 다시 해 보세요');
        }
      }, function(err){ if (my === seq) fail(err); });
    }
    root.addEventListener('click', function(e){
      var pick = e.target.closest('[data-loc-pick]');
      if (pick) {
        var r = results[Number(pick.dataset.locPick)];
        if (!r) return;
        var loc = locationFromKakao(r);
        close();
        q.value = '';
        o.onPick(loc, r);
        drawView();
        return;
      }
      var b = e.target.closest('[data-loc-act]');
      if (!b) return;
      var act = b.dataset.locAct;
      if (act === 'open') open();
      else if (act === 'go') search();
      else if (act === 'cancel') close();
      else if (act === 'retry') { bar.hidden = false; note(''); prepare(!!q.value.trim()); }
      else if (act === 'remove') { o.onRemove(); drawView(); }
    });
    q.addEventListener('keydown', function(e){
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      search();
      q.blur();   // 키패드를 내려 결과가 보이게
    });
    drawView();
  }

  // ---------- 방문 쓰기·고치기 ----------

  // mode: 'new' 새 가게 + 새 방문 / 'add' 이 가게에 새 방문 / 'edit' 이미 있는 방문 고치기
  function visitFormHTML(d, mode, place){
